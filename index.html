<style>
/* Atgoritma: açılış animasyonu, üst menü, afişli ana sayfa (özellikler, üç panel, istatistik kartları) ve alt sayfalar.
   Logo koyu ve altın bir dünya kurduğu için site tek temalı. */
:root {
  --bg: #060c1b;
  --bg2: #0a1328;
  --panel: #0d1630;
  --panel2: #121e3d;
  --ink: #f3f5fb;
  --muted: #9ca9c6;
  --line: #22325a;
  --gold: #f5c542;
  --gold2: #ffe08a;
  --gold-deep: #c8901a;
  --silver: #dfe5ef;
  --on-gold: #0a1226;
  --glow: rgba(245, 197, 66, .35);
  --soft: #172243;
  --kum: #ff9f43;
  --cim: #2fe39b;
  --sentetik: #8d9cff;
  --warn: #ffb547;
  --warn-soft: #3b2a0f;
  --ok: #2fe39b;
  --ok-soft: #0e3327;
  --bad: #ff5d6c;
  --bad-soft: #3e1421;
  --blue: #6fb4ff;
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  background: radial-gradient(1000px 480px at 80% -10%, #1b2d63 0%, transparent 62%), radial-gradient(800px 420px at -5% 35%, #0f2150 0%, transparent 60%), var(--bg); background-attachment: fixed; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.gold-text { background: linear-gradient(180deg, #fff4c8 0%, var(--gold) 48%, var(--gold-deep) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.silver-text { background: linear-gradient(180deg, #fff 0%, var(--silver) 45%, #8e9ab0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Açılış ---------- */
.acilis { position: fixed; inset: 0; z-index: 50; background: radial-gradient(900px 500px at 50% 110%, #1a2a58 0%, #050a17 65%); overflow: hidden; display: grid; place-items: center; transition: opacity .5s ease; }
[hidden] { display: none !important; }
.acilis.kapan { opacity: 0; pointer-events: none; }
/* Betik çalışmasa bile açılış 4 sn sonra kendiliğinden kalkar */
.acilis { animation: acilisBit 0s 4s forwards; }
@keyframes acilisBit { to { visibility: hidden; opacity: 0; pointer-events: none; } }
.a-isiklar { position: absolute; inset: 0 0 auto; height: 45%; display: flex; justify-content: space-around; padding: 4% 6% 0; }
.a-isiklar i { width: 90px; height: 28px; border-radius: 6px; background: repeating-linear-gradient(90deg, #fff8dc 0 10px, transparent 10px 15px); opacity: 0; filter: drop-shadow(0 0 18px #fff3c0) drop-shadow(0 0 40px rgba(255,230,160,.6)); animation: isik .5s ease-out forwards; }
.a-isiklar i::after { content: ""; display: block; width: 300px; height: 420px; margin: 10px 0 0 -105px; background: radial-gradient(closest-side, rgba(255,240,190,.14), transparent); }
.a-isiklar i:nth-child(1) { animation-delay: .15s } .a-isiklar i:nth-child(2) { animation-delay: .35s } .a-isiklar i:nth-child(3) { animation-delay: .55s }
.a-isiklar i:nth-child(4) { animation-delay: .75s } .a-isiklar i:nth-child(5) { animation-delay: .95s }
.a-pist { position: absolute; left: -10%; right: -10%; bottom: 0; height: 32%; background: repeating-linear-gradient(90deg, transparent 0 60px, rgba(245,197,66,.10) 60px 62px), linear-gradient(180deg, transparent, rgba(199,122,35,.25)); transform: perspective(500px) rotateX(55deg); transform-origin: bottom; }
.a-at { position: absolute; width: 340px; height: 236px; overflow: hidden; opacity: 0; animation: at-gel 2.4s 1.1s ease-out forwards; -webkit-mask-image: radial-gradient(closest-side, #000 62%, transparent); mask-image: radial-gradient(closest-side, #000 62%, transparent); }
.a-at img { position: absolute; width: 739px; max-width: none; left: -207px; top: -25px; }
.a-hiz { position: absolute; inset: 0; pointer-events: none; }
.a-hiz i { position: absolute; left: -40%; height: 2px; width: 40%; background: linear-gradient(90deg, transparent, var(--gold2), transparent); opacity: 0; animation: hiz .9s ease-in forwards; box-shadow: 0 0 12px var(--gold); }
.a-hiz i:nth-child(1) { top: 42%; animation-delay: 2.2s } .a-hiz i:nth-child(2) { top: 50%; animation-delay: 2.35s; width: 55% }
.a-hiz i:nth-child(3) { top: 57%; animation-delay: 2.5s } .a-hiz i:nth-child(4) { top: 46%; animation-delay: 2.7s; width: 30% }
.a-hiz i:nth-child(5) { top: 62%; animation-delay: 2.85s; width: 50% }
.a-merkez { position: relative; display: grid; justify-items: center; gap: 14px; padding: 0 16px; text-align: center; }
.a-logo { width: min(560px, 86vw); opacity: 0; animation: logo-gel 1.1s 3.3s cubic-bezier(.2,.8,.2,1) forwards; -webkit-mask-image: radial-gradient(closest-side, #000 70%, transparent); mask-image: radial-gradient(closest-side, #000 70%, transparent); }
.a-logo img { display: block; width: 100%; }
.a-yazi { font-size: clamp(16px, 2.4vw, 24px); opacity: 0; animation: fade .8s 4.1s forwards; }
.a-yazi b { display: block; font-family: var(--font-display); font-weight: 800; }
.a-yukle { position: absolute; bottom: max(36px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(520px, 84vw); display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 12px; letter-spacing: .2em; color: var(--gold); }
.a-bar { grid-column: 1 / -1; height: 8px; border-radius: 6px; border: 1px solid rgba(245,197,66,.5); padding: 1px; }
.a-bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold2)); box-shadow: 0 0 14px var(--gold); animation: yukle 2.6s .2s linear forwards; }
.a-gec { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
@keyframes isik { 0% { opacity: 0 } 40% { opacity: 1 } 55% { opacity: .5 } 100% { opacity: 1 } }
@keyframes at-gel { 0% { opacity: 0; transform: translateX(-120px); filter: blur(8px); } 45% { opacity: 1; transform: translateX(0); filter: blur(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(160px); } }
@keyframes hiz { 0% { opacity: 0; transform: translateX(0) } 20% { opacity: 1 } 100% { opacity: 0; transform: translateX(350%) } }
@keyframes logo-gel { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: scale(1); } }
@keyframes fade { to { opacity: 1; } }
@keyframes yukle { to { width: 100%; } }

/* ---------- Üst menü ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg2); }
.ust { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg2) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); box-shadow: 0 10px 30px -22px var(--glow); }
.ust .wrap { display: flex; align-items: center; gap: 18px; padding-block: 8px; }
.marka { display: flex; align-items: center; text-decoration: none; flex: none; }
.marka-gorsel { width: 104px; height: 56px; position: relative; overflow: hidden; }
.marka-gorsel img { position: absolute; width: 124px; max-width: none; left: -12px; top: -3px; }
nav.menu { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav.menu a { display: flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 10px; border: 1px solid transparent; }
nav.menu a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
nav.menu a:hover { color: var(--ink); }
nav.menu a[aria-current="page"] { color: var(--gold); border-color: rgba(245,197,66,.55); background: rgba(245,197,66,.08); box-shadow: 0 0 16px -6px var(--glow); }
.ust-sag { display: flex; align-items: center; gap: 10px; flex: none; }
.ust-sag select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: 600 13px var(--font-body); }

/* ---------- Ortak ---------- */
main { padding-block: 22px 40px; display: grid; gap: 22px; }
.kart { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
.kart-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px 10px; }
.kart-h h3 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.kart-h h3 svg { width: 20px; height: 20px; stroke: var(--gold); fill: none; stroke-width: 1.8; flex: none; }
.kart-h .sag { margin-left: auto; }
.kart-b { padding: 0 16px 16px; }
h2.bas { font-family: var(--font-display); font-size: 24px; margin: 0; letter-spacing: -.02em; }
.aciklama { color: var(--muted); font-size: 14px; max-width: 75ch; margin: 4px 0 0; }
.sub { color: var(--muted); font-size: 13px; }
.chipler { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 13px/1 var(--font-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: linear-gradient(180deg, var(--gold2), var(--gold) 55%, var(--gold-deep)); color: var(--on-gold); border-color: transparent; box-shadow: 0 0 16px -4px var(--glow); }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 700 13px var(--font-body); color: var(--on-gold); background: linear-gradient(180deg, var(--gold2), var(--gold) 55%, var(--gold-deep)); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; text-decoration: none; box-shadow: 0 0 18px -6px var(--glow); }
.btn.ghost { background: transparent; color: var(--gold); border: 1px solid rgba(245,197,66,.5); box-shadow: none; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.mute { background: var(--soft); color: var(--muted); }
.pill.gold { background: rgba(245,197,66,.14); color: var(--gold); border: 1px solid rgba(245,197,66,.45); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--gold); opacity: .85; font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.num { font-weight: 600; font-variant-numeric: tabular-nums; }
.hn { font-family: var(--font-display); font-weight: 700; font-size: 13px; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); flex: none; }
tr.won .hn, .hn.won { background: var(--gold); color: var(--on-gold); border-color: var(--gold); box-shadow: 0 0 12px var(--glow); }
.bar { display: grid; grid-template-columns: minmax(50px, 1fr) 48px; gap: 8px; align-items: center; }
.bar .b { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar .b i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold2)); box-shadow: 0 0 10px var(--glow); transform-origin: left; animation: dol .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes dol { from { transform: scaleX(0); } }
.form { display: flex; gap: 2px; }
.form i { font-style: normal; font-size: 11px; font-weight: 700; width: 17px; height: 19px; display: grid; place-items: center; border-radius: 3px; color: #0a1226; }
.form i.K { background: var(--kum); } .form i.Ç { background: var(--cim); } .form i.S { background: var(--sentetik); }
.track { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 5px; color: #0a1226; }
.track.Kum { background: var(--kum); } .track.Çim { background: var(--cim); } .track.Sentetik { background: var(--sentetik); }
.tag { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.v { color: var(--ok); border-color: var(--ok); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.bos { padding: 28px; text-align: center; color: var(--muted); }
.uzmansiz .uzmk, .uzmansiz nav.menu a[href="#uzmanlar"] { display: none; }
.uzm { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.uzlasi { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); font-size: 13.5px; }
.uzlasi .uz-ikon { min-width: 38px; height: 30px; padding: 0 6px; border-radius: 8px; display: grid; place-items: center; font: 800 12px var(--font-display); background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.uzlasi.tek, .uzlasi.ilk, .uzlasi.cok { border-color: rgba(245,197,66,.55); background: linear-gradient(90deg, rgba(245,197,66,.14), rgba(245,197,66,.03)); }
.uzlasi.tek .uz-ikon, .uzlasi.ilk .uz-ikon, .uzlasi.cok .uz-ikon { background: linear-gradient(180deg, var(--gold2), var(--gold-deep)); color: var(--on-gold); border-color: transparent; box-shadow: 0 0 14px -2px var(--glow); }
.uzlasi.ters { border-color: rgba(111,180,255,.55); background: linear-gradient(90deg, rgba(111,180,255,.14), rgba(111,180,255,.03)); }
.uzlasi b { color: var(--gold); }
.rozet { font: 800 9.5px var(--font-display); letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; margin-right: 5px; background: var(--gold); color: var(--on-gold); vertical-align: 1px; }
.rozet.ters { background: var(--blue); }
.tag.tek { color: var(--on-gold); background: var(--gold); border-color: var(--gold); }
.uzm b { color: var(--ink); }
.uzm i { font-style: normal; color: var(--gold); font-weight: 700; }
.uzman-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.uzman-satir { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; align-items: center; }
.uzman-satir:last-child { border-bottom: 0; }
.uzman-satir .ad { color: var(--muted); min-width: 0; }
.uzman-satir .ad b { color: var(--ink); }
.secimler { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
.secimler span { min-width: 22px; height: 22px; padding: 0 4px; border-radius: 6px; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); font-weight: 600; font-size: 12px; }
.secimler span.ilk { border-color: rgba(245,197,66,.6); color: var(--gold); }
.secimler span.won { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.madalya { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; margin-right: 6px; background: var(--soft); color: var(--muted); }
.madalya.m1 { background: linear-gradient(180deg, var(--gold2), var(--gold-deep)); color: var(--on-gold); }
.madalya.m2 { background: linear-gradient(180deg, #fff, #9aa3b5); color: var(--on-gold); }
.madalya.m3 { background: linear-gradient(180deg, #f2b27a, #a5612a); color: var(--on-gold); }

/* ---------- Ana sayfa ---------- */
.hero { position: relative; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: #050a17; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); min-height: 340px; box-shadow: 0 30px 70px -45px var(--glow); }
.hero-yazi { position: relative; z-index: 1; padding: 34px 32px; display: grid; align-content: center; gap: 16px; }
.hero-yazi .ust-baslik { font-size: 11.5px; letter-spacing: .22em; color: var(--gold); font-weight: 600; }
.hero-yazi h2 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: clamp(30px, 4.2vw, 50px); line-height: 1.06; letter-spacing: -.03em; text-wrap: balance; }
.hero-yazi p { margin: 0; color: var(--muted); max-width: 46ch; }
.hero-ozellik { display: flex; gap: 14px 22px; flex-wrap: wrap; font-size: 13.5px; font-weight: 600; }
.hero-ozellik span { display: flex; align-items: center; gap: 8px; }
.hero-ozellik svg { width: 20px; height: 20px; stroke: var(--gold); fill: none; stroke-width: 1.8; filter: drop-shadow(0 0 6px var(--glow)); }
.hero-gorsel { position: relative; min-height: 260px; }
.hero-gorsel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 58% 45%; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 28%); mask-image: linear-gradient(90deg, transparent 0%, #000 28%); }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 40%, rgba(255,236,170,.12) 50%, transparent 60%); background-size: 260% 100%; animation: parla 7s ease-in-out infinite; }
@keyframes parla { 0% { background-position: 130% 0; } 60%, 100% { background-position: -130% 0; } }
.ozellikler { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ozellik { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; padding: 14px; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.ozellik:hover { transform: translateY(-3px); border-color: rgba(245,197,66,.5); box-shadow: 0 16px 34px -22px var(--glow); }
.ozellik .ikon { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; background: radial-gradient(circle at 30% 25%, rgba(255,224,138,.25), rgba(245,197,66,.05)); border: 1px solid rgba(245,197,66,.4); }
.ozellik .ikon svg { width: 28px; height: 28px; stroke: var(--gold); fill: none; stroke-width: 1.7; }
.ozellik b { font-family: var(--font-display); font-size: 15px; }
.ozellik p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.uclu { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.55fr) minmax(0, .9fr); gap: 14px; align-items: start; }
.kosu-liste { display: grid; gap: 2px; }
.kosu-satir { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto 46px 26px; gap: 8px; align-items: center; padding: 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; background: none; text-align: left; width: 100%; font-size: 13px; }
.kosu-satir:hover { background: var(--soft); }
.kosu-satir[aria-pressed="true"] { background: rgba(245,197,66,.10); border-color: rgba(245,197,66,.45); }
.kosu-satir .tip { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kosu-satir .ok { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--on-gold); font-size: 9px; }
.tahmin-govde { display: grid; grid-template-columns: minmax(0, 1fr) 124px; gap: 10px; align-items: center; }
.tahmin-govde td { padding: 7px 6px; }
.tahmin-govde .bar { grid-template-columns: minmax(36px, 1fr) 44px; }
.atad { display: flex; gap: 8px; align-items: center; min-width: 0; }
.atad b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.tahmin-govde tr.ilk td { background: rgba(245,197,66,.12); }
.halka { display: grid; justify-items: center; gap: 6px; text-align: center; }
.halka svg { width: 122px; height: 122px; }
.halka .yazi { font-family: var(--font-display); font-weight: 800; font-size: 22px; fill: var(--ink); }
.halka .alt { font-size: 9px; fill: var(--muted); }
.altili-liste { display: grid; gap: 4px; }
.altili-satir { display: grid; grid-template-columns: 80px 1fr auto; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--soft); font-size: 13.5px; border: 1px solid transparent; }
.altili-satir .ay { font-weight: 700; color: var(--gold); }
.altili-satir .ay i { font-style: normal; }
.altili-satir .ay i.w { background: var(--ok); color: #04140d; border-radius: 5px; padding: 0 5px; }
.altili-satir .dr { font-size: 12px; font-weight: 700; white-space: nowrap; color: var(--muted); }
.altili-satir.ok { background: var(--ok-soft); border-color: rgba(47,227,155,.45); }
.altili-satir.ok .dr { color: var(--ok); }
.altili-satir.dead { background: var(--bad-soft); border-color: rgba(255,93,108,.5); }
.altili-satir.dead .dr { color: var(--bad); }
.altili-satir.dead .ay { color: var(--muted); }
.altili-satir.sira { border-color: var(--gold); box-shadow: 0 0 14px -6px var(--glow); }
.altili-satir.sira .dr { color: var(--gold); }
.canli-bant { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,93,108,.45); background: linear-gradient(90deg, rgba(255,93,108,.16), rgba(255,93,108,.04)); font-size: 13.5px; }
.canli-bant.bitti { border-color: var(--line); background: var(--soft); }
.canli-bant b.cnl { display: inline-flex; align-items: center; gap: 7px; color: var(--bad); letter-spacing: .08em; font-family: var(--font-display); }
.canli-bant.bitti b.cnl { color: var(--muted); }
.canli-bant b.cnl::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 rgba(255,93,108,.7); animation: nabiz 1.6s infinite; }
.canli-bant.bitti b.cnl::before { animation: none; }
.canli-bant .sub { margin-left: auto; }
@keyframes nabiz { 0% { box-shadow: 0 0 0 0 rgba(255,93,108,.7); } 70% { box-shadow: 0 0 0 9px rgba(255,93,108,0); } 100% { box-shadow: 0 0 0 0 rgba(255,93,108,0); } }
.kupon-durum { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill.canli { background: rgba(255,93,108,.14); color: #ff8b96; border: 1px solid rgba(255,93,108,.45); }
.yeni-sonuc { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--panel2); border: 1px solid var(--gold); color: var(--ink); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; box-shadow: 0 10px 30px -10px #000; max-width: calc(100vw - 32px); }
.altili-alt { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.sistem { font-family: var(--font-display); font-weight: 800; color: var(--gold); }
.istatistikler { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.buyuk-sayi { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: -.03em; line-height: 1; }
.fark { font-size: 13px; font-weight: 700; }
.fark.art { color: var(--ok); } .fark.eks { color: var(--bad); }
.grafik { width: 100%; height: auto; display: block; }
.grafik text { fill: var(--muted); font-size: 9px; font-family: var(--font-body); }
.sutunlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; align-items: end; height: 150px; padding-top: 6px; }
.sutun { display: grid; gap: 6px; justify-items: center; align-content: end; height: 100%; font-size: 12px; }
.sutun .s { width: 70%; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--gold2), var(--gold) 40%, var(--gold-deep)); box-shadow: 0 0 16px -4px var(--glow); transform-origin: bottom; animation: yuksel .9s cubic-bezier(.2,.8,.2,1) both; }
.sutun b { font-family: var(--font-display); font-size: 14px; }
.sutun span { color: var(--muted); }
@keyframes yuksel { from { transform: scaleY(0); } }
.halkalar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.halkalar svg { width: 100%; max-width: 96px; height: auto; }
.halkalar text { font-family: var(--font-display); font-weight: 800; font-size: 20px; fill: var(--ink); }
.dipnot { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* ---------- Yarış kartları ---------- */
.yaris-kartlari { display: grid; gap: 14px; }
.race { overflow: hidden; scroll-margin-top: 90px; }
.race-h { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(245,197,66,.10), transparent 55%); }
.rno { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; min-width: 46px; text-align: center; letter-spacing: -.03em; }
.rno small { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0; -webkit-text-fill-color: var(--muted); }
.rinfo { min-width: 0; display: grid; gap: 3px; }
.rinfo .t { font-weight: 700; }
.rinfo .m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.risk { display: grid; gap: 4px; justify-items: end; min-width: 96px; }
.risk .lbl { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.meter { width: 96px; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
.meter.hi i { background: linear-gradient(90deg, var(--warn), var(--bad)); }
.risk .v { font-weight: 700; font-size: 15px; }
.result { padding: 8px 16px; font-size: 13px; background: linear-gradient(90deg, rgba(255,211,77,.18), transparent 70%); border-bottom: 1px solid var(--line); }
/* altılı kupon kartları */
.kuponlar { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 14px; padding: 0 16px 16px; }
.kupon { border: 1px solid var(--line); border-radius: 14px; background: var(--bg2); overflow: hidden; display: grid; }
.kupon-ust { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px dashed var(--line); }
.kupon-ust h4 { margin: 0; font-family: var(--font-display); font-size: 16px; }
.kupon-ust .sag { margin-left: auto; }
.kupon-bilgi { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px dashed var(--line); }
.kupon-bilgi div { padding: 8px 14px; display: grid; gap: 1px; }
.kupon-bilgi div + div { border-left: 1px solid var(--line); }
.kupon-bilgi span { font-size: 11.5px; color: var(--muted); }
.kupon-bilgi b { font-family: var(--font-display); font-size: 16px; }
.legs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 12px; }
.leg { display: flex; flex-direction: column; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; min-width: 0; }
.leg-bas { display: grid; justify-items: center; padding: 6px 2px 5px; background: rgba(245,197,66,.08); border-bottom: 2px solid var(--line); }
.leg-bas b { font-family: var(--font-display); font-size: 12.5px; color: var(--gold); letter-spacing: .04em; white-space: nowrap; }
.leg-bas small { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.leg-no { display: grid; justify-items: center; gap: 6px; padding: 9px 2px 10px; }
.leg-no span { display: grid; place-items: center; width: 34px; height: 30px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font: 700 16px var(--font-display); font-variant-numeric: tabular-nums; }
.leg-no span.w { background: var(--ok); border-color: var(--ok); color: #04140d; box-shadow: 0 0 12px -3px var(--ok); }
.leg-kaz { margin-top: auto; padding: 5px 2px; text-align: center; font-size: 11px; font-weight: 700; border-top: 1px solid var(--line); }
.leg.ok { border-color: var(--ok); }
.leg.ok .leg-bas { background: var(--ok-soft); border-bottom-color: var(--ok); }
.leg.ok .leg-bas b, .leg.ok .leg-kaz { color: var(--ok); }
.leg.dead { border-color: var(--bad); }
.leg.dead .leg-bas { background: var(--bad-soft); border-bottom-color: var(--bad); }
.leg.dead .leg-bas b, .leg.dead .leg-kaz { color: var(--bad); }
.leg.dead .leg-no span { opacity: .55; }
.leg.sira { border-color: var(--gold); box-shadow: 0 0 14px -6px var(--glow); }
.leg.sira .leg-bas { border-bottom-color: var(--gold); }
.leg.sira .leg-kaz { color: var(--gold); }
.leg-kaz.bos { color: var(--muted); font-weight: 500; }
@media (max-width: 480px) {
  .leg .gz { display: none; }
  .leg-bas b { font-size: 15px !important; }
  .legs { gap: 4px; padding: 10px 8px; }
  .leg-no span { width: 28px; height: 28px; font-size: 14.5px; }
  .leg-bas b { font-size: 11px; }
  .kupon-bilgi div { padding: 8px 10px; }
}

/* ---------- Karşılaştırma, istatistik, motor ---------- */
.secim { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.secim select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: 600 14px var(--font-body); max-width: 100%; }
.kiyas td:first-child { color: var(--muted); }
.kiyas td.ust { color: var(--gold); font-weight: 700; }
.ikili { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.akis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; counter-reset: a; }
.akis div { padding: 14px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.akis b { display: block; color: var(--ink); font-family: var(--font-display); margin-bottom: 4px; }
.akis b::before { counter-increment: a; content: counter(a) ". "; color: var(--gold); }
.agirlik { display: grid; grid-template-columns: 150px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; }
footer { border-top: 1px solid var(--line); padding-block: 18px 32px; color: var(--muted); font-size: 12.5px; display: grid; gap: 6px; }
footer p { margin: 0; }
footer a { color: var(--gold); }
.yasal-serit { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--ink); font-size: 12.5px; }
.yas18 { display: inline-grid; place-items: center; min-width: 34px; height: 24px; padding: 0 6px; border-radius: 6px; border: 1.5px solid var(--bad); color: var(--bad); font: 800 12px var(--font-display); }
.uyari-not { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-top: 10px; }
.uyari-not .yas18 { height: 20px; min-width: 30px; font-size: 11px; flex: none; }
.yasal { display: grid; gap: 14px; }
.yasal h3 { font-family: var(--font-display); font-size: 16px; margin: 0 0 4px; }
.yasal p, .yasal li { font-size: 14px; color: var(--muted); margin: 0; max-width: 85ch; }
.yasal ul { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.yasal b { color: var(--ink); }
.yasal a { color: var(--gold); }
.onay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(3, 7, 18, .82); backdrop-filter: blur(6px); }
.onay[hidden] { display: none; }
.onay-kutu { max-width: 520px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 12px; box-shadow: 0 30px 80px -30px #000; }
.onay-kutu h2 { margin: 0; font-family: var(--font-display); font-size: 20px; display: flex; gap: 10px; align-items: center; }
.onay-kutu ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
.onay-kutu ul b { color: var(--ink); }
.onay-dug { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

.isabet-ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.isabet-ikili > div { display: grid; gap: 2px; align-content: start; }
.isabet-ikili .buyuk-sayi { font-size: clamp(30px, 4vw, 42px); }
.isabet-ikili .fark { font-size: 12px; }
/* Atgoritma yorumları */
.yorum-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.yorum-kart { padding: 14px 16px 16px; display: grid; gap: 10px; align-content: start; scroll-margin-top: 90px; }
.yorum-ust { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.yorum-ust .rno { font-family: var(--font-display); font-size: 26px; font-weight: 800; line-height: 1; }
.yorum-ust .bilgi { display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); }
.yorum-ust .bilgi b { color: var(--text); font-size: 14px; }
.yorum-ust .sag { margin-left: auto; }
.yazar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.atg-rozet { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #f5c542, #b8862b); color: #14100a; font-family: var(--font-display); font-weight: 800; font-size: 14px; }
.yazar b { color: var(--gold); }
.yorum-metin { margin: 0; font-size: 14.5px; line-height: 1.6; }
.yorum-metin .an { font-weight: 700; color: var(--text); }
.tercih { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.tercih span.no { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--soft); font-weight: 800; font-size: 15px; color: var(--text); }
.tercih span.no.ilk { border-color: var(--gold); color: var(--gold); }
.tercih span.no.ikili { min-width: 44px; font-size: 14px; }
.tercih span.no.w { background: #2fbf71; border-color: transparent; color: #08130d; }
.yorum-kupon { padding: 12px 16px; display: grid; gap: 6px; font-size: 13.5px; }
.yorum-kupon .ay { font-family: var(--font-display); font-weight: 700; letter-spacing: .02em; word-break: break-word; }
/* altılı zorluk ve tipleri */
.zorluk { border: 1px solid var(--line); border-radius: 12px; background: var(--soft); padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; }
.zorluk.zor { border-color: rgba(245,158,11,.45); }
.zorluk-ust { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.zorluk-ust b { font-family: var(--font-display); font-size: 20px; }
.zorluk-bilgi { display: grid; gap: 3px; color: var(--muted); }
.zorluk-bilgi b { color: var(--text); }
.zorluk .pas { color: var(--warn, #f59e0b); }
.tipler { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; }
.tip-tablo td .yuksek { color: #f59e0b; font-weight: 700; }
.tip-tablo td .dusuk { color: var(--ok); font-weight: 700; }
/* öne çıkanlar */
.one-cikan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.ikili-ana { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.aday-liste { display: grid; gap: 8px; }
.aday-sehir { display: flex; align-items: baseline; gap: 8px; margin: 6px 2px 0; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.aday-sehir:first-child { margin-top: 0; }
.aday-sehir b { font-family: var(--font-display); font-size: 15px; color: var(--gold); }
.aday-sehir span { font-size: 12px; color: var(--muted); }
.aday { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 10px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); text-align: left; width: 100%; cursor: pointer; color: inherit; font: inherit; }
.aday:hover { border-color: rgba(245,197,66,.5); }
.aday .hn { grid-row: span 2; }
.aday .ad { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aday .yer { font-size: 12px; color: var(--muted); grid-column: 2; }
.aday .yuzde { grid-row: span 2; display: grid; justify-items: end; }
.aday .yuzde b { font: 800 19px var(--font-display); color: var(--gold); }
.aday .yuzde small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.aday .nedenk { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.aday.won { border-color: var(--ok); background: var(--ok-soft); }
.aday.lost { opacity: .6; }
.aday.surpriz .yuzde b { color: var(--blue); }
.etk { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(47,227,155,.12); color: var(--ok); white-space: nowrap; }
.etk.eksi { background: rgba(255,93,108,.12); color: #ff8b96; }
.gecmis { font-size: 12px; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.gecmis b { color: var(--ink); }
.atad-alt { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.neden-kart { display: grid; gap: 12px; }
.neden-at { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--soft); display: grid; gap: 8px; }
.neden-at h4 { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 15px; }
.neden-at h4 .sag { margin-left: auto; color: var(--gold); }
.neden-satir { display: grid; grid-template-columns: minmax(0, 150px) 1fr 46px; gap: 8px; align-items: center; font-size: 12.5px; }
.neden-satir .cubuk { position: relative; height: 10px; border-radius: 5px; background: var(--panel); }
.neden-satir .cubuk i { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.neden-satir .cubuk i.arti { left: 50%; background: var(--ok); }
.neden-satir .cubuk i.eksi { right: 50%; background: var(--bad); }
.neden-satir .cubuk::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.neden-ozet { font-size: 13px; color: var(--muted); margin: 0; }
.neden-ozet b { color: var(--ink); }
nav.alt-menu { display: none; }

@media (max-width: 1020px) {
  .one-cikan, .ikili-ana { grid-template-columns: 1fr; }
  .ozellikler { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .uclu, .istatistikler { grid-template-columns: 1fr; }
  .akis { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .hero-gorsel { min-height: 200px; order: -1; }
  .hero-gorsel img { -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); mask-image: linear-gradient(180deg, #000 60%, transparent); }
  .hero-yazi { padding: 8px 20px 24px; }
  .ust .wrap { flex-wrap: wrap; gap: 6px 12px; }
  nav.menu { order: 3; flex-basis: 100%; }
  .ozellikler, .ikili, .tahmin-govde, .akis { grid-template-columns: 1fr; }
  .race-h { grid-template-columns: auto 1fr; }
  .risk { grid-column: 1 / -1; justify-items: start; grid-template-columns: auto auto auto; align-items: center; gap: 8px; }
  .agirlik { grid-template-columns: 120px 1fr 40px; }
  /* yarış günü telefonda: kısa vitrin, alt menü */
  .hero-gorsel { min-height: 130px; }
  .hero-yazi p, .hero-ozellik, .hero-yazi .ust-baslik { display: none; }
  .hero-yazi h2 { font-size: 24px; }
  .hero-yazi { padding: 4px 18px 16px; gap: 8px; }
  .kosu-satir { grid-template-columns: 56px minmax(0, 1fr) 46px 26px; }
  .kosu-satir > .sub { display: none; }
  nav.menu { display: none; }
  nav.alt-menu { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg2) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
