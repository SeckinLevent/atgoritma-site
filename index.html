      <span class="yuzde"><b>%${pct(z.p, 0)}</b><small>${tur === "surpriz" ? `piyasa %${pct(z.agf, 0)}` : gb ? `geçmiş %${yz(gb.gercek, 0)}` : ""}</small></span>
      <span class="yer">${esc(x.s.ad)} ${x.n}. koşu · ${esc(x.k.saat)}${x.r ? (won ? " · <b style='color:var(--ok)'>Kazandı</b>" : ` · kazanan ${x.r.no}`) : ""}</span>
      <span class="nedenk">${nedenEtiket(z, x.k)}</span></button>`;
  }
  let gi = 0, si = 0, ki = null, ai = 0, kk = null, ka = 0, kb = 1;
  const gun = () => V.gunler[gi];
  const sehir = () => gun()?.sehirler[si];
  const nolar = (s) => Object.keys(s.kosular).map(Number).sort((a, b) => a - b);
  const sonuc = (g, s, no) => V.sonuc[`${g.tarih}|${s.slug}|${no}`];

  function form(s) {
    const m = [...String(s || "").matchAll(/([ÇKS])(\d)/g)];
    return m.length ? `<span class="form" title="Son 6 yarış; en eski solda">${m.map((x) => `<i class="${x[1]}">${x[2] === "0" ? "–" : x[2]}</i>`).join("")}</span>` : `<span class="sub">ilk koşu</span>`;
  }
  // Bir altılı kuponunun ayak ayak durumu: koşu bittiyse kazanan (ekürisiyle) ayakta mı
  function ayakDurum(g, s, a, kp) {
    let sira = false;
    const ay = kp.ayaklar.map((l, i) => {
      const r = sonuc(g, s, a.bas + i);
      if (!r) { const d = { d: sira ? "bekle" : "sira", w: [] }; sira = true; return d; }
      const w = r.kazananlar || [r.no];
      return { d: l.some((x) => w.includes(x)) ? "ok" : "dead", w, r };
    });
    const yatan = ay.findIndex((x) => x.d === "dead");
    const gecen = ay.filter((x) => x.d === "ok").length;
    return { ay, yatan: yatan + 1, gecen, tuttu: gecen === ay.length, bitti: ay.every((x) => x.d === "ok" || x.d === "dead") };
  }
  function durumPill(dr, kayit) {
    if (dr.tuttu) return `<span class="pill ok">Tuttu ✓</span>`;
    if (dr.yatan) return `<span class="pill bad">${dr.yatan}. ayakta yattı</span>`;
    if (dr.gecen) return `<span class="pill canli">Canlı · ${dr.gecen}/${dr.ay.length} ayak geçti</span>`;
    return kayit || "";
  }
  function canliBant(g) {
    const c = V.canli && V.canli[g?.tarih];
    if (!c) return "";
    const sh = g.sehirler.filter((x) => c[x.slug]);
    const bitti = sh.every((x) => c[x.slug].biten >= c[x.slug].toplam);
    return `<div class="canli-bant${bitti ? " bitti" : ""}" role="status"><b class="cnl">${bitti ? "GÜN TAMAMLANDI" : "CANLI"}</b>
      ${sh.map((x) => `<span><b>${esc(x.ad)}</b> ${c[x.slug].biten}/${c[x.slug].toplam} koşu bitti</span>`).join("")}
      <span class="sub">TJK sonuçları · son kontrol ${esc(c.guncel || "")}</span></div>`;
  }
  function oneriPill(o) {
    if (!o) return "";
    if (o.startsWith("OYNANABİLİR")) return `<span class="pill ok">Değer var</span>`;
    if (o.startsWith("PAS")) return `<span class="pill mute">Pas: değer düşük</span>`;
    return `<span class="pill warn">AGF bekleniyor</span>`;
  }
  function halka(p, alt) {
    const r = 48, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, p || 0));
    return `<svg viewBox="0 0 120 120" role="img" aria-label="${alt} %${pct(v, 1)}"><defs><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#c8901a"/><stop offset="1" stop-color="#ffe08a"/></linearGradient></defs>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--soft)" stroke-width="10"/>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="url(#hg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <text x="60" y="62" text-anchor="middle" class="yazi">%${pct(v, 1)}</text><text x="60" y="80" text-anchor="middle" class="alt">${alt}</text></svg>`;
  }
  /* Uzmanlar takma adla gelir ("Uzman 1" en başarılı); sıralama numaraya göre */
  const uzmanSira = (a) => { const m = /(?:^Uzman |#)(\d+)$/.exec(a); return m ? +m[1] : 1000 + a.charCodeAt(a.length - 1); };
  function uzmanSay(s, no, atNo) {
    let say = 0, ilk = 0, top = 0; const ad = [];
    for (const [k, v] of Object.entries(s.uzman || {})) {
      const l = v[String(no)];
      if (!l || !l.length) continue;
      top++;
      if (l.includes(atNo)) { say++; ad.push(k); }
      if (l[0] === atNo) ilk++;
    }
    ad.sort((a, b) => uzmanSira(a) - uzmanSira(b));
    return { say, ilk, top, ad };
  }
  /* Koşudaki uzman uzlaşısı: hepsi aynı atı tek mi verdi, ilk tercihlerde birleşiyorlar mı, model aynı yerde mi */
  function uzlasi(s, no, k) {
    const ls = Object.values(s.uzman || {}).map((v) => v[String(no)]).filter((l) => l && l.length);
    const N = ls.length;
    if (!N) return null;
    const ilk = {}, tek = {};
    ls.forEach((l) => { ilk[l[0]] = (ilk[l[0]] || 0) + 1; if (l.length === 1) tek[l[0]] = (tek[l[0]] || 0) + 1; });
    const [ia, ib] = Object.entries(ilk).sort((a, b) => b[1] - a[1])[0];
    const te = Object.entries(tek).sort((a, b) => b[1] - a[1])[0];
    const at = (n) => { const z = k.atlar.find((x) => x.no === +n); return z ? `${n} ${esc(z.at)}` : n; };
    const m1 = k.atlar[0].no;
    let tip, metin, hedef;
    if (te && te[1] >= 2 && te[1] === N) { tip = "tek"; hedef = +te[0]; metin = `${N} uzmanın hepsi <b>${at(te[0])}</b> atını TEK verdi`; }
    else if (te && te[1] >= 2) { tip = "tek"; hedef = +te[0]; metin = `${N} uzmandan ${te[1]} tanesi <b>${at(te[0])}</b> atını TEK verdi`; }
    else if (N >= 2 && ib === N) { tip = "ilk"; hedef = +ia; metin = `${N} uzmanın hepsinin ilk tercihi <b>${at(ia)}</b>`; }
    else if (N >= 3 && ib / N >= 0.6) { tip = "cok"; hedef = +ia; metin = `${N} uzmandan ${ib} tanesinin ilk tercihi <b>${at(ia)}</b>`; }
    else { tip = "dag"; hedef = +ia; metin = `Uzmanlar dağınık: ilk tercihler ${Object.entries(ilk).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, c]) => `${n} (${c})`).join(", ")}`; }
    const ayni = hedef === m1;
    const model = tip === "dag" ? "" : ayni ? `Model de ${m1} numarayı birinci görüyor (%${pct(k.atlar[0].p)}).`
      : `Model farklı düşünüyor: modelin birincisi ${m1} ${esc(k.atlar[0].at)} (%${pct(k.atlar[0].p)}); ${hedef} numaraya %${pct((k.atlar.find((x) => x.no === hedef) || {}).p)} veriyor.`;
    return { tip, hedef, ayni, N, metin, model };
  }
  function uzlasiKutu(u) {
    if (!u) return "";
    const ikon = u.tip === "tek" ? "TEK" : u.tip === "dag" ? "≈" : "★";
    return `<div class="uzlasi ${u.tip}${u.tip !== "dag" && !u.ayni ? " ters" : ""}"><span class="uz-ikon">${ikon}</span>
      <div><div>${u.metin}</div>${u.model ? `<div class="sub">${u.model}</div>` : ""}</div></div>`;
  }
  function uzmanHucre(u) {
    if (!u.top) return `<span class="sub">-</span>`;
    return `<span class="uzm" title="${esc(u.ad.join(", "))}"><b>${u.say}</b>/${u.top}${u.ilk ? ` <i>★${u.ilk}</i>` : ""}</span>`;
  }
  function secici() {
    const g = gun();
    if (!g) return "";
    return `<div class="chipler" role="group" aria-label="Hipodrom">${g.sehirler.map((x, j) => `<button class="chip" type="button" data-s="${j}" aria-pressed="${j === si}">${esc(x.ad)}</button>`).join("")}</div>`;
  }

  /* ----- ana sayfa ----- */
  function ana() {
    const g = gun(), s = sehir();
    const hero = `<section class="hero" aria-label="Atgoritma">
      <div class="hero-yazi">
        <span class="ust-baslik">YAPAY ZEKÂ DESTEKLİ AT YARIŞI ANALİZ PLATFORMU</span>
        <h2><span class="silver-text">Veriyle analiz,</span><br><span class="silver-text">bilimle tahmin,</span><br><span class="gold-text">şeffaf karne.</span></h2>
        <p>TJK'nın resmi program ve sonuçlarıyla eğitilen model her gün tüm hipodromlar için atların kazanma olasılığını hesaplar ve her tahmini sonuçla birlikte kayda geçirir.</p>
        <div class="hero-ozellik"><span>${IK.ai}Yapay zekâ analizi</span><span>${IK.veri}${(S?.toplam_yaris || V.test.kosu).toLocaleString("tr-TR")} koşuluk veri</span>
          <span>${IK.hedef}Kalibre olasılık</span><span>${IK.seri}Altılı stratejileri</span></div>
      </div>
      <div class="hero-gorsel"><img src="vitrin.webp" alt=""></div>
    </section>`;
    const ozellik = `<section class="ozellikler" aria-label="Analiz başlıkları">
      ${[[IK.ai, "Yapay Zekâ Analizi", "Form, hız, jokey, galop ve piyasa dahil 31 kriteri tek bir kazanma olasılığında birleştirir."],
        [IK.form, "Form ve Derece", "Son 6 yarış, aynı pist formu, hız ve mağlubiyet farkı."],
        [IK.jokey, "Jokey ve Antrenör", "Koşu tipine ve hipodroma göre kazanma kayıtları."],
        [IK.pist, "Pist ve Mesafe", "Kum, çim, sentetik, mesafe uyumu ve sürpriz riski."]]
        .map(([i, b, p]) => `<div class="kart ozellik"><span class="ikon">${i}</span><div><b>${b}</b><p>${p}</p></div></div>`).join("")}
    </section>`;
    if (!g || !s) return hero + ozellik + `<div class="kart bos">Henüz tahmin yok.</div>` + istatistikKartlari();
    const ns = nolar(s);
    if (ki == null || !s.kosular[ki]) ki = ns[0];
    const liste = ns.map((n) => {
      const k = s.kosular[n], r = sonuc(g, s, n);
      return `<button class="kosu-satir" type="button" data-k="${n}" aria-pressed="${n === ki}">
        <b>${n}. Koşu</b><span class="tip">${(() => { const u = uzlasi(s, n, k); return u && u.tip !== "dag" ? `<span class="rozet${u.ayni ? "" : " ters"}" title="${u.metin.replace(/<[^>]+>/g, "")}">${u.tip === "tek" ? "TEK " : "★ "}${u.hedef}</span>` : ""; })()}${esc(k.grup || k.tip)}</span><span class="sub">${k.mesafe} m ${esc(k.pist)}</span>
        <span class="num">${esc(k.saat)}</span>${r ? `<span class="hn won" title="Kazanan">${r.no}</span>` : `<span class="ok">▶</span>`}</button>`;
    }).join("");
    const k = s.kosular[ki], r = sonuc(g, s, ki);
    const pl = k.piyasa === "yenibeygir Blt" ? "Blt" : "AGF";
    const tum = gunTum(g);
    // AI'nın en güçlü adayları: her koşunun model favorisi, olasılığa göre
    const adaylar = tum.map((x) => ({ x, z: x.k.atlar[0] }));
    // Sürpriz atlar: piyasada 3. sıra ve gerisinde olup modelin belirgin şans verdiği atlar
    const surprizler = tum.flatMap((x) => {
      const ag = [...x.k.atlar].sort((a, b) => b.agf - a.agf);
      return x.k.atlar.filter((z) => ag.indexOf(z) >= 2 && z.p >= 0.1 && z.p > z.agf * 1.25).map((z) => ({ x, z }));
    });
    const gb0 = gecmisBasari(k.atlar[0].p), gr = grupAd(k.tip), gs = gr && S?.grup?.[gr];
    const tahmin = `<div class="tahmin-govde"><div class="scroll"><table><thead><tr><th>Sıra</th><th>At</th><th>Kazanma olasılığı</th><th>${pl}</th><th class="uzmk">Uzman</th></tr></thead><tbody>
      ${k.atlar.slice(0, 5).map((z, i) => `<tr class="${i === 0 ? "ilk" : ""} ${r && r.no === z.no ? "won" : ""}"><td class="num">${i + 1}</td>
        <td><div class="atad"><span class="hn">${z.no}</span><div style="min-width:0"><b title="${esc(z.at)}">${esc(z.at)}</b><div class="atad-alt">${nedenler(z, k).filter(([, v]) => v > 0).slice(0, 2).map(([a]) => esc(a)).join(" · ")}</div></div></div></td>
        <td><div class="bar"><span class="b"><i style="width:${(100 * z.p / k.atlar[0].p).toFixed(0)}%"></i></span><span class="num">%${pct(z.p, 1)}</span></div></td>
        <td class="num sub">${k.piyasa === "AGF yok" ? "-" : "%" + pct(z.agf, 1)}</td><td class="uzmk">${uzmanHucre(uzmanSay(s, ki, z.no))}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="halka">${halka(k.atlar[0].p, "Kazanma olasılığı")}<span class="pill ${k.surpriz >= .3 ? "warn" : "mute"}">Sürpriz riski %${pct(k.surpriz)}</span></div></div>
      ${gb0 ? `<div class="gecmis" style="margin-top:10px">Geçmiş başarı: model bir ata <b>${esc(gb0.aralik)}</b> şans verdiğinde, ${gb0.n.toLocaleString("tr-TR")} attan <b>%${yz(gb0.gercek)}</b>'i kazandı.${gs ? ` ${esc(gr)} koşularında model favorisi <b>%${yz(gs.model_birinci)}</b> kazandı, ilk 3'e <b>%${yz(gs.model_ilk3)}</b> girdi.` : ""} <a href="#motor" style="color:var(--gold)">Neden bu sıralama?</a></div>` : ""}
      <div style="margin-top:10px">${uzlasiKutu(uzlasi(s, ki, k))}</div>
      ${r ? `<p class="dipnot">Kazanan: <b>${r.no} ${esc(r.at)}</b> · ganyan ${esc(r.ganyan).replace(".", ",")} · modelde ${r.model_sira}. sıradaydı</p>` : ""}`;
    const alts = s.altililar || [];
    ai = Math.min(ai, Math.max(alts.length - 1, 0));
    let altPanel = `<div class="bos">Bu hipodromda altılı yok.</div>`;
    if (alts.length) {
      const a = alts[ai];
      const kad = a.kuponlar.kucuk ? "kucuk" : a.kuponlar.tutma_1000 ? "tutma_1000" : Object.keys(a.kuponlar)[0];
      const kp = a.kuponlar[kad];
      const rs = V.alt_sonuc[`${g.tarih}|${s.slug}|${a.sira}|${kad}`];
      const dr = ayakDurum(g, s, a, kp);
      altPanel = `${zorlukKutu(s, a)}${alts.length > 1 ? `<div class="chipler" style="margin:10px 0">${alts.map((x, j) => `<button class="chip" type="button" data-a="${j}" aria-pressed="${j === ai}">${x.sira}. Altılı</button>`).join("")}</div>` : ""}
        <div class="altili-liste">${kp.ayaklar.map((l, i) => { const x = dr.ay[i];
          return `<div class="altili-satir ${x.d}"><span>${a.bas + i}. Koşu</span><span class="ay">${l.map((n) => `<i class="${x.w.includes(n) ? "w" : ""}">${n}</i>`).join(" - ")}</span>
          <span class="dr">${x.d === "ok" ? `✓ ${x.w.join(",")} kazandı` : x.d === "dead" ? `✗ ${x.w.join(",")} kazandı` : x.d === "sira" ? `▶ ${esc(s.kosular[a.bas + i]?.saat || "")}` : esc(s.kosular[a.bas + i]?.saat || "")}</span></div>`; }).join("")}</div>
        <div class="altili-alt"><div><div class="sub">Sistem</div><div class="sistem">${kp.ayaklar.map((l) => l.length).join("/")}</div>
          <div class="sub">${kp.kombinasyon} kombinasyon · ${tl(kp.tutar)} · tutma %${pct(kp.tutma, 1)}</div></div>
          <div style="display:grid;gap:6px;justify-items:end">${durumPill(dr, oneriPill(a.oneri))}${rs && rs.ikramiye ? `<span class="sub">İkramiye ${tl(rs.ikramiye)}</span>` : ""}
          <a class="btn" href="#altili">Detaylı analiz ›</a></div></div>`;
    }
    const oneCikan = `<section class="one-cikan" aria-label="Günün öne çıkanları">
      <div class="kart"><div class="kart-h"><h3>${IK.takvim}Bugünün Yarışları</h3><span class="sag sub">${gunYaz(g.tarih)}</span></div>
        <div class="kart-b" style="display:grid;gap:10px">${secici()}<div class="kosu-liste">${liste}</div></div></div>
      <div class="kart"><div class="kart-h"><h3>${IK.ai}AI'nın En Güçlü Adayları</h3></div>
        <div class="kart-b"><div class="aday-liste">${sehirGrup(g, adaylar, (a, b) => b.z.p - a.z.p, "guclu")}</div>
        <p class="dipnot">Her hipodromda modelin en güçlü 3 favorisi, koşu sırasıyla. "Geçmiş": model bu aralıkta şans verdiğinde atların gerçekte kazanma oranı.</p></div></div>
      <div class="kart"><div class="kart-h"><h3>${IK.hedef}Sürpriz Atlar</h3></div>
        <div class="kart-b"><div class="aday-liste">${surprizler.length ? sehirGrup(g, surprizler, (a, b) => b.z.p / b.z.agf - a.z.p / a.z.agf, "surpriz") : `<div class="bos">Bugün piyasadan belirgin ayrışan at yok.</div>`}</div>
        <p class="dipnot">Piyasada 3. sıra ve gerisinde olup modelin piyasadan en az %25 fazla şans verdiği atlar.</p></div></div>
    </section>`;
    const uclu = `<section class="ikili-ana" aria-label="Seçili koşu">
      <div class="kart" id="modelTahmin"><div class="kart-h"><h3>${IK.kupa}Model Tahmini · ${ki}. Koşu (${esc(s.ad)})</h3>
        <span class="sub" style="flex-basis:100%">${esc(k.tip)} · ${esc(k.grup)} · ${k.mesafe} m ${esc(k.pist)}${k.piyasa !== "TJK AGF" ? " · TJK AGF'si henüz yok" : ""}</span></div>
        <div class="kart-b">${tahmin}<div style="margin-top:12px"><a class="btn ghost" href="#yarislar" data-git="k${ki}">Tüm atlar ve ayrıntılar ›</a></div></div></div>
      <div class="kart"><div class="kart-h"><h3>${IK.bilet}Altılı Ganyan · Model Kuponu</h3><span class="sag pill gold">İstatistik çıktısı</span></div><div class="kart-b">${altPanel}${UYARI_KUPON}</div></div>
    </section>`;
    return hero + canliBant(g) + oneCikan + uclu + istatistikKartlari() + ozellik;
  }

  function cizgiGrafik(seri) {
    if (seri.length < 2) return "";
    const W = 300, H = 120, P = 24;
    const vals = seri.flatMap((d) => [d.m, d.a]);
    const lo = Math.floor(Math.min(...vals) / 5) * 5, hi = Math.ceil(Math.max(...vals) / 5) * 5;
    const x = (i) => P + (i * (W - P - 6)) / (seri.length - 1);
    const y = (v) => H - 16 - ((v - lo) * (H - 28)) / Math.max(hi - lo, 1);
    const yol = (k) => seri.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join("");
    const son = seri[seri.length - 1];
    const tr = (t) => t.slice(5).split("-").reverse().join(".");
    return `<svg class="grafik" viewBox="0 0 ${W} ${H}" role="img" aria-label="Yedi günlük hareketli isabet oranı">
      <defs><linearGradient id="alan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(245,197,66,.35)"/><stop offset="1" stop-color="rgba(245,197,66,0)"/></linearGradient></defs>
      ${[lo, (lo + hi) / 2, hi].map((v) => `<line x1="${P}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="0" y="${y(v) + 3}">%${v}</text>`).join("")}
      <path d="${yol("m")}L${x(seri.length - 1)},${H - 16}L${x(0)},${H - 16}Z" fill="url(#alan)"/>
      <path d="${yol("a")}" fill="none" stroke="var(--blue)" stroke-width="1.4" stroke-dasharray="3 3" opacity=".8"/>
      <path d="${yol("m")}" fill="none" stroke="var(--gold)" stroke-width="2.2"/>
      <circle cx="${x(seri.length - 1)}" cy="${y(son.m)}" r="3.5" fill="var(--gold2)"/>
      <text x="${P}" y="${H - 2}">${tr(seri[0].d)}</text><text x="${W - 6}" y="${H - 2}" text-anchor="end">${tr(son.d)}</text></svg>`;
  }

  function istatistikKartlari() {
    if (!S) return "";
    const gl = Object.entries(S.gunluk);
    let n = 0, m3 = 0, a3 = 0, m1 = 0, a1 = 0;
    gl.slice(-30).forEach(([, v]) => { n += v.n; m3 += v.model_ilk3 * v.n; a3 += v.agf_ilk3 * v.n; m1 += v.model_birinci * v.n; a1 += v.agf_birinci * v.n; });
    const mo = m3 / n, ao = a3 / n, b1 = m1 / n, ba = a1 / n;
    const seri = [];
    for (let i = 6; i < gl.length; i++) {
      let nn = 0, mm = 0, aa = 0;
      gl.slice(i - 6, i + 1).forEach(([, v]) => { nn += v.n; mm += v.model_ilk3 * v.n; aa += v.agf_ilk3 * v.n; });
      seri.push({ d: gl[i][0], m: mm / nn, a: aa / nn });
    }
    const gruplar = ["Maiden", "Şartlı", "Handikap", "KV", "Grup", "Diğer"].filter((k) => S.grup[k]);
    const pistler = ["Çim", "Kum", "Sentetik"].filter((k) => S.pist[k]);
    const renk = { Çim: "var(--cim)", Kum: "var(--kum)", Sentetik: "var(--sentetik)" };
    return `<section class="istatistikler" aria-label="Model başarısı">
      <div class="kart"><div class="kart-h"><h3>${IK.hedef}İsabet oranı <span class="sub">(son 30 yarış günü)</span></h3></div>
        <div class="kart-b"><div class="isabet-ikili">
            <div><span class="sub">Kazanan modelin ilk 3'ünde</span><span class="buyuk-sayi gold-text">%${yz(mo)}</span>
              <span class="fark ${mo >= ao ? "art" : "eks"}">AGF %${yz(ao)} · ${mo >= ao ? "+" : "−"}${yz(Math.abs(mo - ao))} puan</span></div>
            <div><span class="sub">Birinci tercih kazandı</span><span class="buyuk-sayi gold-text">%${yz(b1)}</span>
              <span class="fark ${b1 >= ba + 0.5 ? "art" : b1 <= ba - 0.5 ? "eks" : ""}">AGF %${yz(ba)} · ${Math.abs(b1 - ba) < 0.5 ? "başa baş" : (b1 >= ba ? "+" : "−") + yz(Math.abs(b1 - ba)) + " puan"}</span></div></div>
          <p class="dipnot" style="margin:2px 0 6px">${n.toLocaleString("tr-TR")} koşu. Birinci tercihte model AGF ile aynı düzeydedir; farkı ilk 3 sıralamasında ve olasılıkların doğruluğunda yaratır. Grafik ilk 3 oranı: altın model, mavi kesikli AGF (7 günlük ortalama).</p>
          ${cizgiGrafik(seri.slice(-40))}</div></div>
      <div class="kart"><div class="kart-h"><h3>${IK.seri}Koşu tiplerine göre başarı</h3></div>
        <div class="kart-b"><div class="sutunlar">${gruplar.map((k) => `<div class="sutun"><b>%${yz(S.grup[k].model_ilk3, 0)}</b><div class="s" style="height:${(S.grup[k].model_ilk3 * 1.4).toFixed(0)}px"></div><span>${k}</span></div>`).join("")}</div>
          <p class="dipnot">Kazananı ilk 3'te gösterme · test dönemi ${esc(S.donem)}</p></div></div>
      <div class="kart"><div class="kart-h"><h3>${IK.pist}Pist performansı</h3></div>
        <div class="kart-b"><div class="halkalar">${pistler.map((k) => {
          const v = S.pist[k].model_ilk3 / 100, r = 40, c = 2 * Math.PI * r;
          return `<div><svg viewBox="0 0 100 100" role="img" aria-label="${k} %${yz(v * 100)}"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--soft)" stroke-width="9"/>
            <circle cx="50" cy="50" r="${r}" fill="none" stroke="${renk[k]}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>
            <text x="50" y="57" text-anchor="middle">%${yz(v * 100, 0)}</text></svg><div><span class="track ${k}">${k}</span></div><div class="sub">${S.pist[k].n.toLocaleString("tr-TR")} koşu</div></div>`;
        }).join("")}</div><p class="dipnot">Kazananı ilk 3'te gösterme oranı, pist türüne göre</p></div></div>
    </section>`;
  }

  /* ----- günün yarışları ----- */
  function kosuKarti(g, s, no, k) {
    const r = sonuc(g, s, no), hi = k.surpriz >= 0.3;
    const pl = k.piyasa === "yenibeygir Blt" ? "Blt" : "AGF";
    const maxp = Math.max(...k.atlar.map((z) => z.p));
    const rows = k.atlar.map((z, i) => {
      const tags = [];
      if (z.yenihipo) tags.push(`<span class="tag">hipodromda ilk</span>`);
      const tk = Object.values(s.uzman || {}).filter((v) => { const l = v[String(no)]; return l && l.length === 1 && l[0] === z.no; }).length;
      if (tk) tags.push(`<span class="tag tek">${tk} uzman tek</span>`);
      if (z.p > z.agf * 1.3 && z.p > 0.08) tags.push(`<span class="tag v">model piyasadan yüksek</span>`);
      return `<tr class="${r && r.no === z.no ? "won" : ""}"><td class="num">${i + 1}</td><td><span class="hn">${z.no}</span></td>
        <td><b>${esc(z.at)}</b><div class="sub">${esc(z.jokey)}${z.hnd ? ` · H${z.hnd}` : ""}</div></td><td>${form(z.son6)}</td>
        <td class="uzmk">${uzmanHucre(uzmanSay(s, no, z.no))}</td>
        <td><div class="bar"><span class="b"><i style="width:${(100 * z.p / maxp).toFixed(0)}%"></i></span><span class="num">%${pct(z.p, 1)}</span></div></td>
        <td class="num">${k.piyasa === "AGF yok" ? "-" : "%" + pct(z.agf, 1)}</td><td class="num">${(1.2 / Math.max(z.p, 0.001)).toFixed(2)}</td>
        <td><div class="tags">${tags.join("")}</div></td></tr>`;
    }).join("");
    return `<article class="kart race" id="k${no}">
      <div class="race-h"><div class="rno gold-text">${no}<small>${esc(k.saat)}</small></div>
        <div class="rinfo"><span class="t">${esc(k.tip)}</span><span class="m"><span>${esc(k.grup)}</span><span class="track ${esc(k.pist)}">${k.mesafe} m ${esc(k.pist)}</span>
          ${k.piyasa !== "TJK AGF" ? `<span class="pill warn">${k.piyasa === "AGF yok" ? "AGF yok" : "Blt ile"}</span>` : ""}</span></div>
        <div class="risk"><span class="lbl">Sürpriz</span><span class="meter${hi ? " hi" : ""}"><i style="width:${Math.min(100, k.surpriz * 140)}%"></i></span><span class="v">%${pct(k.surpriz)}</span></div></div>
      ${r ? `<div class="result">${r.canli ? `<span class="pill canli">Canlı sonuç</span> ` : ""}Kazanan <b>${r.no} ${esc(r.at)}</b> · ganyan ${esc(r.ganyan).replace(".", ",")} · modelde ${r.model_sira}. sıradaydı${r.sira ? ` · ilk dört ${r.sira.join("-")}` : ""}</div>` : ""}
      ${(() => { const u = uzlasi(s, no, k); return u ? `<div style="padding:10px 16px 0">${uzlasiKutu(u)}</div>` : ""; })()}
      <div class="scroll"><table><thead><tr><th>Sıra</th><th>No</th><th>At</th><th>Son yarışlar</th><th class="uzmk" title="Atı öneren uzman / o koşuyu yorumlayan uzman; ★ ilk tercih yapan">Uzman</th><th>Model</th><th>${pl}</th><th title="Ganyan oranı bu değerin üstündeyse model değer görüyor">Değer ≥</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></article>`;
  }
  function yarislar() {
    const g = gun(), s = sehir();
    if (!g || !s) return `<div class="kart bos">Henüz tahmin yok.</div>`;
    const ns = nolar(s);
    return `<div><h2 class="bas">${esc(s.ad)} · ${gunYaz(g.tarih)}</h2><p class="aciklama">${ns.length} koşu. Satır sırası modelin önceliğidir. Model yüzdesi atın kazanma olasılığı; sürpriz skoru kazananın modelin ilk 3'ü dışından gelme ihtimali.</p></div>
      ${canliBant(g)}${secici()}<div class="chipler">${ns.map((n) => `<button class="chip" type="button" data-git="k${n}">${n}. koşu</button>`).join("")}</div>
      <div class="yaris-kartlari">${ns.map((n) => kosuKarti(g, s, n, s.kosular[n])).join("")}</div>`;
  }

  /* ----- altılı ----- */
  function altiliSayfa() {
    const g = gun(), s = sehir();
    if (!g || !s) return `<div class="kart bos">Henüz tahmin yok.</div>`;
    const panel = (s.altililar || []).map((a) => {
      const kart = Object.entries(a.kuponlar).map(([ad, k]) => {
        const r = V.alt_sonuc[`${g.tarih}|${s.slug}|${a.sira}|${ad}`];
        const dr = ayakDurum(g, s, a, k);
        const legs = k.ayaklar.map((l, i) => {
          const x = dr.ay[i], kn = a.bas + i;
          const alt = x.d === "ok" ? `✓<span class="gz"> geçti</span>` : x.d === "dead" ? `✗<span class="gz"> kazanan</span> ${x.w.join(",")}` : x.d === "sira" ? `▶<span class="gz"> sıradaki</span>` : "";
          return `<div class="leg ${x.d}"><div class="leg-bas"><b>${i + 1}.<span class="gz"> AYAK</span></b><small><span class="gz">${kn}. koşu · </span>${esc(s.kosular[kn]?.saat || "")}</small></div>
            <div class="leg-no">${l.map((n) => `<span class="${x.w.includes(n) ? "w" : ""}">${n}</span>`).join("")}</div>
            <div class="leg-kaz${alt ? "" : " bos"}">${alt || (l.length === 1 ? "tek" : k.kapali && k.kapali[i] ? `hepsi<span class="gz"> (${l.length})</span>` : l.length + `<span class="gz"> at</span>`)}</div></div>`;
        }).join("");
        return `<article class="kupon"><div class="kupon-ust"><h4>${kuponAd(ad)}</h4><span class="sub">${k.ayaklar.map((l) => l.length).join("×")} sistem</span>
            <span class="sag">${durumPill(dr, r ? (r.tuttu ? `<span class="pill ok">Tuttu</span>` : `<span class="pill bad">${r.yatan}. ayakta yattı</span>`) : "")}</span></div>
          <div class="kupon-bilgi"><div><span>Tutar</span><b>${tl(k.tutar)}</b><span>${k.kombinasyon} kombinasyon</span></div>
            <div><span>Tutma ihtimali</span><b>%${pct(k.tutma, 1)}</b>${k.hedef ? `<span>hedef %${pct(k.hedef)}</span>` : ""}</div>
            <div><span>Tahmini getiri</span><b>${k.getiri == null ? "-" : "%" + pct(k.getiri)}</b></div></div>
          <div class="legs">${legs}</div></article>`;
      }).join("");
      const r0 = V.alt_sonuc[`${g.tarih}|${s.slug}|${a.sira}|${Object.keys(a.kuponlar)[0]}`];
      return `<section class="kart"><div class="kart-h"><h3>${IK.bilet}${a.sira}. Altılı</h3><span class="sub">${a.bas}–${a.bas + 5}. koşular</span>${zorlukPill(s, a)}${oneriPill(a.oneri)}
        ${r0 && r0.ikramiye ? `<span class="pill mute">İkramiye ${tl(r0.ikramiye)}</span>` : ""}</div>
        <div style="padding:0 16px 12px">${zorlukKutu(s, a)}</div>
        <div class="kuponlar">${kart}</div></section>`;
    }).join("") || `<div class="kart bos">Bu hipodromda altılı yok.</div>`;
    return `<div><h2 class="bas">Altılı Ganyan · ${esc(s.ad)}</h2><p class="aciklama">Her altılı için iki kupon: küçük ve geniş. Bütçe sabit değildir; altılı sakinse ucuz, sürprizliyse pahalı olur. Küçük kupon %12, geniş kupon %30 tutma ihtimaline ulaşan en ucuz bütçeyle kurulur. Bütçe içinde favorisi net ayaklar dar (tek at), sürprizli ayaklar geniş tutulur; kurulumda sürpriz atın getireceği yüksek ikramiye de hesaba girer ve dışarıda en fazla 2 at kalan ayak kapatılır. Tahmini getiri kaba bir hesaptır; %100'ün üstü göründüğünde bile geriye dönük testte gerçekleşmedi. Geriye dönük testte her gün altılı oynamak zarar ettirdi (en iyi kuralla 100 TL'ye yaklaşık 46–66 TL geri döndü). Koşular bittikçe ayaklar canlı işaretlenir: yeşil geçti, kırmızı yattı.</p>${UYARI_KUPON}</div>${canliBant(g)}${secici()}${panel}`;
  }

  /* ----- uzmanlar ----- */
  function madalya(a) { const n = uzmanSira(a); return `<span class="madalya ${n <= 3 ? "m" + n : ""}">${n < 1000 ? n : "Y"}</span>`; }
  function uzmanlar() {
    const g = gun(), s = sehir();
    const kr = V.uzman_karne, cn = V.uzman_canli || {};
    const karne = kr ? `<div class="kart"><div class="kart-h"><h3>${IK.hedef}Uzman sıralaması</h3><span class="sub">${esc(kr.donem)} · en az ${kr.min_n} koşu</span></div>
      <div class="kart-b"><p class="dipnot" style="margin:0 0 8px">Uzmanlar ilk tercihlerinin piyasanın (AGF) beklentisinden ne kadar sık kazandığına göre sıralanır; az koşulu olanların farkı sıfıra doğru çekilir. Gerçek isimler yayınlanmaz.</p>
      <div class="scroll"><table><thead><tr><th>Sıra</th><th>Koşu</th><th>İlk tercih kazandı</th><th>AGF beklentisi</th><th>Fark</th><th>Kazananı kapsama</th><th>Ort. at</th></tr></thead><tbody>
      ${kr.tahminci.map((t) => { const f = t.ilk - t.beklenen;
        return `<tr><td>${madalya(t.ad)}<b>${esc(t.ad)}</b></td><td class="num">${t.kosu.toLocaleString("tr-TR")}</td><td class="num">%${yz(t.ilk)}</td><td class="num sub">%${yz(t.beklenen)}</td>
        <td class="num" style="color:${f >= 0 ? "var(--ok)" : "var(--bad)"}">${f >= 0 ? "+" : ""}${yz(f)}</td><td class="num">%${yz(t.kapsama, 0)}</td><td class="num">${yz(t.ort_at)}</td></tr>`; }).join("")}
      </tbody></table></div></div></div>` : `<div class="kart"><div class="kart-b bos">Uzman sıralaması hesaplanıyor; arşiv toplanınca burada görünecek.</div></div>`;
    if (!g || !s) return `<div><h2 class="bas">Uzmanlar</h2></div>` + karne;
    const ns = nolar(s);
    const uz = Object.entries(s.uzman || {}).sort((a, b) => uzmanSira(a[0]) - uzmanSira(b[0]));
    const kart = ns.map((n) => {
      const k = s.kosular[n], r = sonuc(g, s, n);
      const satir = uz.filter(([, v]) => (v[String(n)] || []).length).map(([ad, v]) => {
        const l = v[String(n)];
        const bi = (s.uzman_bilgi || {})[ad] || {};
        const alt = bi.sira ? `${bi.kosu} koşuda ilk tercih %${yz(bi.ilk, 0)} (AGF'ye göre ${bi.fark >= 0 ? "+" : ""}${yz(bi.fark)})${bi.pist ? " · " + bi.pist : ""}${bi.genel ? " · genelde " + bi.genel + "." : ""}`
          : bi.genel ? `Bu hipodromda az kaydı var · genelde ${bi.genel}.` : "Henüz yeterli kaydı yok";
        return `<div class="uzman-satir"><span class="ad">${madalya(ad)}<b>${esc(ad)}</b><div class="sub" style="font-size:11.5px;margin-left:28px">${alt}</div></span>
          <span class="secimler">${l.map((x, j) => `<span class="${r && r.no === x ? "won" : j === 0 ? "ilk" : ""}">${x}</span>`).join("")}</span></div>`;
      }).join("");
      const say = {};
      uz.forEach(([, v]) => (v[String(n)] || []).forEach((x) => { say[x] = (say[x] || 0) + 1; }));
      const cok = Object.entries(say).sort((a, b) => b[1] - a[1])[0];
      return `<div class="kart"><div class="kart-h"><h3><span class="gold-text" style="font-size:20px;font-weight:800">${n}.</span> Koşu</h3><span class="sub">${esc(k.saat)} · ${esc(k.grup)} · ${k.mesafe} m ${esc(k.pist)}</span></div>
        <div class="kart-b"><div class="chipler" style="margin-bottom:8px">
          <span class="pill gold">Model: ${k.atlar[0].no} ${esc(k.atlar[0].at)} %${pct(k.atlar[0].p)}</span>
          ${cok ? `<span class="pill mute">Uzman çoğunluğu: ${cok[0]} (${cok[1]} uzman)</span>` : ""}
          ${r ? `<span class="pill ok">Kazanan ${r.no}</span>` : ""}</div>
          ${satir || `<div class="sub">Bu koşu için uzman seçimi yok.</div>`}</div></div>`;
    }).join("");
    const canli = Object.entries(cn).sort((a, b) => uzmanSira(a[0]) - uzmanSira(b[0]));
    return `<div><h2 class="bas">Uzmanlar · ${esc(s.ad)} · ${gunYaz(g.tarih)}</h2><p class="aciklama">Uzman yorumları ve editör kuponları her gün otomatik toplanır, başarıya göre sıralanır ve takma adla gösterilir. Numara sırası uzmanın öneri sırasıdır; altın çerçeve ilk tercih, dolu altın kazanan at.</p></div>
      ${secici()}${karne}
      ${canli.length ? `<div class="kart"><div class="kart-h"><h3>${IK.takvim}Canlı defter</h3><span class="sub">Yayına başlandığından beri</span></div><div class="scroll"><table><thead><tr><th>Uzman</th><th>Koşu</th><th>İlk tercih kazandı</th><th>Kazananı kapsadı</th></tr></thead><tbody>
        ${canli.map(([a, v]) => `<tr><td>${madalya(a)}${esc(a)}</td><td class="num">${v.kosu}</td><td class="num">%${yz(100 * v.ilk / v.kosu, 0)}</td><td class="num">%${yz(100 * v.kapsama / v.kosu, 0)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
      <div class="uzman-grid">${kart}</div>`;
  }

  /* ----- karşılaştırma ----- */
  function karsilastir() {
    const g = gun(), s = sehir();
    if (!g || !s) return `<div class="kart bos">Henüz tahmin yok.</div>`;
    const ns = nolar(s);
    if (kk == null || !s.kosular[kk]) kk = ns[0];
    const k = s.kosular[kk], at = k.atlar;
    ka = Math.min(ka, at.length - 1); kb = Math.min(kb, at.length - 1);
    const A = at[ka], B = at[kb], r = sonuc(g, s, kk);
    const sat = (ad, f, iyi) => { const u = iyi ? iyi(A, B) : 0;
      return `<tr><td>${ad}</td><td class="${u > 0 ? "ust" : ""}">${f(A, ka)}</td><td class="${u < 0 ? "ust" : ""}">${f(B, kb)}</td></tr>`; };
    const sec = (id, v) => `<select id="${id}" aria-label="At">${at.map((z, i) => `<option value="${i}" ${i === v ? "selected" : ""}>${z.no} · ${esc(z.at)}</option>`).join("")}</select>`;
    return `<div><h2 class="bas">At Karşılaştırma</h2><p class="aciklama">Aynı koşudaki iki atı modelin gözünden yan yana koyar. Üstün olan değer altın renkte.</p></div>${secici()}
      <div class="kart"><div class="kart-b" style="padding-top:16px;display:grid;gap:14px">
        <div class="secim"><select id="kSec" aria-label="Koşu">${ns.map((n) => `<option value="${n}" ${n === kk ? "selected" : ""}>${n}. koşu · ${esc(s.kosular[n].grup)}</option>`).join("")}</select>${sec("kA", ka)}<span class="sub">ile</span>${sec("kB", kb)}</div>
        <div class="scroll"><table class="kiyas"><thead><tr><th>Kriter</th><th>${A.no} ${esc(A.at)}</th><th>${B.no} ${esc(B.at)}</th></tr></thead><tbody>
          ${sat("Model kazanma olasılığı", (z) => `%${pct(z.p, 1)}`, (a, b) => a.p - b.p)}
          ${sat("Modeldeki sıra", (z, i) => `${i + 1}.`, () => kb - ka)}
          ${sat(k.piyasa === "yenibeygir Blt" ? "Blt payı" : "AGF payı", (z) => `%${pct(z.agf, 1)}`, (a, b) => a.agf - b.agf)}
          ${sat("Model / piyasa oranı", (z) => yz(z.p / Math.max(z.agf, 1e-3), 2), (a, b) => a.p / a.agf - b.p / b.agf)}
          ${sat("Değer için ganyan ≥", (z) => (1.2 / z.p).toFixed(2))}
          ${sat("Son yarışlar", (z) => form(z.son6))}
          ${sat("Handikap puanı", (z) => z.hnd ?? "-", (a, b) => (a.hnd || 0) - (b.hnd || 0))}
          ${V.uzman_kapali ? "" : sat("Uzman desteği", (z) => uzmanHucre(uzmanSay(s, kk, z.no)), (a, b) => uzmanSay(s, kk, a.no).say - uzmanSay(s, kk, b.no).say)}
          ${sat("Jokey", (z) => esc(z.jokey))}
          ${sat("Bu hipodromda", (z) => (z.yenihipo ? "ilk koşusu" : "daha önce koştu"))}
          ${r ? sat("Sonuç", (z) => (r.no === z.no ? "Kazandı" : "-")) : ""}
        </tbody></table></div></div></div>`;
  }

  /* ----- istatistik ----- */
  function tablo(baslik, obj, ad = (k) => k) {
    const e = Object.entries(obj || {});
    if (!e.length) return "";
    return `<div class="kart"><div class="kart-h"><h3>${IK.seri}${baslik}</h3></div><div class="scroll"><table><thead><tr><th></th><th>Koşu</th><th>Model birinci</th><th>AGF birinci</th><th>Model ilk 3</th><th>AGF ilk 3</th></tr></thead><tbody>
      ${e.map(([k, v]) => `<tr><td><b>${esc(ad(k))}</b></td><td class="num">${v.n.toLocaleString("tr-TR")}</td><td class="num">%${yz(v.model_birinci)}</td><td class="num sub">%${yz(v.agf_birinci)}</td>
        <td class="num" style="color:${v.model_ilk3 >= v.agf_ilk3 ? "var(--ok)" : "var(--bad)"}">%${yz(v.model_ilk3)}</td><td class="num sub">%${yz(v.agf_ilk3)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  function kalibrasyon(b, baslik, not) {
    if (!b) return "";
    const W = 320, H = 150, bw = (W - 30) / b.length;
    return `<div class="kart"><div class="kart-h"><h3>${IK.hedef}${baslik}</h3></div><div class="kart-b">
      <svg class="grafik" viewBox="0 0 ${W} ${H}" role="img" aria-label="${baslik}">
      ${[0, 25, 50, 75].map((v) => `<line x1="24" x2="${W}" y1="${H - 20 - v * 1.4}" y2="${H - 20 - v * 1.4}" stroke="var(--line)" stroke-width=".6"/><text x="0" y="${H - 17 - v * 1.4}">%${v}</text>`).join("")}
      ${b.map((d, i) => `<rect x="${28 + i * bw}" y="${H - 20 - d.tahmin * 1.4}" width="${bw * .38}" height="${d.tahmin * 1.4}" rx="2" fill="var(--blue)" opacity=".75"/>
        <rect x="${28 + i * bw + bw * .42}" y="${H - 20 - d.gercek * 1.4}" width="${bw * .38}" height="${d.gercek * 1.4}" rx="2" fill="var(--gold)"/>
        <text x="${28 + i * bw + bw * .4}" y="${H - 6}" text-anchor="middle">${esc(d.aralik)}</text>`).join("")}</svg>
      <p class="dipnot">Mavi: modelin söylediği · Altın: gerçekleşen. ${not}</p></div></div>`;
  }
  function istatistik() {
    const k = V.karne, t = V.test, g = S?.genel;
    const alt = (k.altili || []).map((a) => `<tr><td>${kuponAd(a.kupon)}</td><td class="num">${a.tuttu}/${a.oynanan}</td><td class="num">${tl(a.harcanan)}</td><td class="num">${tl(a.odeme)}</td></tr>`).join("");
    return `<div><h2 class="bas">İstatistikler</h2><p class="aciklama">Geriye dönük test, modelin eğitimde hiç görmediği dönemde yapılır (${esc(S?.donem || t.donem)}). Canlı defter yayına başlandığından beri her gün tutulur.</p></div>
      ${istatistikKartlari()}
      <div class="ikili">
        <div class="kart"><div class="kart-h"><h3>${IK.hedef}Geriye dönük test</h3></div><div class="kart-b"><table><tbody>
          <tr><td>Test koşusu</td><td class="num">${(g?.n || 0).toLocaleString("tr-TR")}</td></tr>
          <tr><td>Kazananı birinci bilme</td><td class="num">Model %${yz(g?.model_birinci ?? t.model_birinci)} · AGF %${yz(g?.agf_birinci ?? t.agf_birinci)}</td></tr>
          <tr><td>Kazananı ilk 3'te gösterme</td><td class="num">Model %${yz(g?.model_ilk3 ?? t.model_ilk3)} · AGF %${yz(g?.agf_ilk3 ?? t.agf_ilk3)}</td></tr>
          <tr><td>Altılı, her gün oynansa</td><td class="num">getiri ${esc(t.altili_getiri)} (zarar)</td></tr>
          <tr><td>Sanal ganyan değer bahsi</td><td class="num">${esc(t.ganyan_getiri)}; kanıtlanmadı</td></tr></tbody></table></div></div>
        <div class="kart"><div class="kart-h"><h3>${IK.takvim}Canlı defter</h3></div><div class="kart-b"><table><tbody>
          <tr><td>Kayıtlı koşu</td><td class="num">${k.kosu} koşu · ${k.gun} gün</td></tr>
          <tr><td>Kazananı birinci bilme</td><td class="num">Model %${k.model_birinci ?? "-"} · AGF %${k.agf_birinci ?? "-"}</td></tr>
          <tr><td>Kazananı ilk 3'te gösterme</td><td class="num">Model %${k.model_ilk3 ?? "-"} · AGF %${k.agf_ilk3 ?? "-"}</td></tr>
          <tr><td>Sürpriz uyarıları</td><td class="num">${k.surpriz_uyari ?? 0} koşu, %${k.surpriz_gercek ?? "-"} gerçekleşti</td></tr>
          <tr><td>Sanal ganyan değer bahisleri</td><td class="num">${k.ganyan ? `${k.ganyan.bahis} bahis · %${k.ganyan.getiri} getiri` : "-"}</td></tr></tbody></table>
          ${alt ? `<div class="scroll" style="margin-top:10px"><table><thead><tr><th>Altılı kuponu</th><th>Tuttu</th><th>Harcanan</th><th>Ödeme</th></tr></thead><tbody>${alt}</tbody></table></div>` : ""}</div></div>
      </div>
      <div class="ikili">${kalibrasyon(S?.kalibrasyon, "Olasılık kalibrasyonu", "Model %20 dediği atların ne kadarı gerçekten kazandı?")}
        ${kalibrasyon(S?.surpriz, "Sürpriz skoru kalibrasyonu", "Kazananın modelin ilk 3'ü dışından gelme oranı.")}</div>
      <div class="ikili">${tablo("Koşu tipine göre", S?.grup)}${tablo("Pist türüne göre", S?.pist)}</div>
      <div class="ikili">${tablo("Hipodroma göre", S?.sehir, (x) => SEHIR[x] || x)}${tablo("Irka göre", S?.irk)}</div>
      ${altiliTipleri()}`;
  }
  // Altılı tipleri (kod/altili_tipleri.py): üç sezonun gerçek verisi, betimleyici
  function altiliTipleri() {
    const T = V.altili_tipleri;
    if (!T || !T.tablo) return "";
    const BOL = ["Hipodrom", "Favorilerin gücü", "Arap ayak sayısı", "Handikap ayak sayısı", "Kısa mesafe (≤1300 m) ayak sayısı",
      "Kalabalık maiden (≥11 at) ayak sayısı", "Altılı sırası", "Yıl"];
    const ad = (b, t) => b === "Hipodrom" ? SEHIR[t] || t : /ayak sayısı/.test(b) ? `${t}${t === "5" || t === "3" && /maiden/.test(b) ? "+" : ""} ayak` : t;
    const genel = T.tablo.find((x) => x.bolum === "Tümü");
    const kart = BOL.map((b) => {
      const sat = T.tablo.filter((x) => x.bolum === b);
      if (!sat.length) return "";
      return `<div class="kart"><div class="kart-h"><h3>${esc(b)}</h3></div><div class="scroll"><table class="tip-tablo"><thead><tr><th>Tip</th><th>Altılı</th><th title="Kazananı AGF'nin ilk 3'ü dışından gelen ayak">Sürpriz ayak</th><th>Medyan ikramiye</th><th>₺100 bin+</th></tr></thead><tbody>
        ${sat.map((x) => `<tr><td>${esc(ad(b, x.tip))}</td><td class="num">${x.n.toLocaleString("tr-TR")}</td>
          <td class="num"><span class="${x.sur >= genel.sur + 0.15 ? "yuksek" : x.sur <= genel.sur - 0.15 ? "dusuk" : ""}">${yz(x.sur, 2)}</span></td>
          <td class="num">${tl(x.medyan)}</td><td class="num">%${yz(x.yuz_bin, 0)}</td></tr>`).join("")}</tbody></table></div></div>`;
    }).join("");
    return `<div><h2 class="bas" style="margin-top:10px">Altılı tipleri</h2><p class="aciklama">${genel.n.toLocaleString("tr-TR")} altılının gerçek sonucu (2023-2026, resmi altılı AGF tablosu ve ikramiyeler). Sürpriz ayak: kazananın AGF'nin ilk 3'ü dışından geldiği ayak sayısı; genel ortalama ${yz(genel.sur, 2)}, medyan ikramiye ${tl(genel.medyan)}. Turuncu ortalamadan belirgin sürprizli, yeşil belirgin sakin. Model kullanılmaz; yalnız gerçekleşen veri.</p></div>
      <div class="tipler">${kart}</div>`;
  }

  /* ----- analiz motoru ----- */
  function motor() {
    const w = Object.entries(S?.agirlik || {}).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
    const mx = Math.max(...w.map(([, v]) => Math.abs(v)), 1e-6);
    const g = gun(), s = sehir();
    let neden = "";
    if (g && s) {
      const ns = nolar(s);
      if (ki == null || !s.kosular[ki]) ki = ns[0];
      const k = s.kosular[ki], r = sonuc(g, s, ki);
      const ilk = k.atlar.slice(0, 3);
      const mxv = Math.max(0.05, ...ilk.flatMap((z) => nedenler(z, k).map(([, v]) => Math.abs(v))));
      const atKart = (z, i) => {
        const l = nedenler(z, k), gb = gecmisBasari(z.p);
        const art = l.filter(([, v]) => v > 0).slice(0, 4), eks = l.filter(([, v]) => v < 0).slice(-3).reverse();
        const satir = ([a, v]) => `<div class="neden-satir"><span>${esc(a)}</span><span class="cubuk"><i class="${v > 0 ? "arti" : "eksi"}" style="width:${(50 * Math.min(1, Math.abs(v) / mxv)).toFixed(0)}%"></i></span><span class="num sub">${v > 0 ? "+" : "−"}${yz(Math.abs(v), 2)}</span></div>`;
        return `<div class="neden-at"><h4><span class="hn${r && r.no === z.no ? " won" : ""}">${z.no}</span>${esc(z.at)}<span class="sag">%${pct(z.p, 1)}</span></h4>
          <p class="neden-ozet">${i === 0 ? "Model favorisi" : `Modelde ${i + 1}. sırada`} · ${k.piyasa === "AGF yok" ? "piyasa verisi yok" : `${k.piyasa === "yenibeygir Blt" ? "Blt" : "AGF"} %${pct(z.agf, 1)}`}${gb ? ` · geçmişte bu aralıkta kazanma <b>%${yz(gb.gercek)}</b>` : ""}</p>
          ${art.length ? `<div style="display:grid;gap:5px"><span class="sub" style="font-size:12px">Lehine</span>${art.map(satir).join("")}</div>` : ""}
          ${eks.length ? `<div style="display:grid;gap:5px"><span class="sub" style="font-size:12px">Aleyhine</span>${eks.map(satir).join("")}</div>` : ""}
          ${!l.length ? `<p class="neden-ozet">Bu tahmin için kriter dökümü yok (eski kayıt).</p>` : ""}</div>`;
      };
      neden = `<div class="kart" id="nedenKart"><div class="kart-h"><h3>${IK.hedef}Favori neden favori? · ${esc(s.ad)} ${ki}. koşu</h3>
          <span class="sub" style="flex-basis:100%">${esc(k.tip)} · ${esc(k.grup)} · ${k.mesafe} m ${esc(k.pist)} · ${esc(k.saat)}</span></div>
        <div class="kart-b neden-kart">${secici()}<div class="chipler">${ns.map((n) => `<button class="chip" type="button" data-k="${n}" aria-pressed="${n === ki}">${n}. koşu</button>`).join("")}</div>
          <p class="neden-ozet">Çubuklar her kriterin atın puanını koşudaki diğer atlara göre ne kadar yükselttiğini (yeşil) ya da düşürdüğünü (kırmızı) gösterir. Puanlar olasılığa koşu içinde çevrilir.</p>
          <div class="ikili">${ilk.map(atKart).join("")}</div></div></div>`;
    }
    return `<div><h2 class="bas">Analiz Motoru</h2><p class="aciklama">Atgoritma her koşuyu kendi içinde değerlendirir: atları birbirine göre sıralayan kriterleri, koşu tipine göre ayrı öğrenilen ağırlıklarla tek bir kazanma olasılığında birleştirir.</p></div>
      ${neden}
      <div class="kart"><div class="kart-b" style="padding-top:16px"><div class="akis">
        <div><b>TJK verisi</b>10 hipodromun resmi program ve sonuç dosyaları, ${(S?.toplam_yaris || 0).toLocaleString("tr-TR")} koşu.</div>
        <div><b>Kriterler</b>Form, derece, hız, handikap, kilo, jokey, antrenör, kulvar, pist, galop (idman) ve AGF.</div>
        <div><b>Koşullu logit</b>Koşu içi olasılık modeli; ağırlıklar Maiden, Şartlı, KV, Handikap ve Grup/açık (G1-G3, kupalı) koşular için ayrı sapar.</div>
        <div><b>Sürpriz katmanı</b>Arap, kısa mesafe, dağınık favori gibi durumlarda olasılıkları yumuşatır.</div>
        <div><b>Kupon</b>Bütçe içinde tutma olasılığını en yükseğe çıkaran ayak genişlikleri.</div></div></div></div>
      <div class="ikili">
        <div class="kart"><div class="kart-h"><h3>${IK.seri}Kriterlerin etki gücü</h3></div><div class="kart-b" style="display:grid;gap:7px">
          ${w.map(([k, v]) => `<div class="agirlik"><span>${esc(OZ[k] || k)}</span><span class="bar" style="grid-template-columns:1fr"><span class="b"><i style="width:${(100 * Math.abs(v) / mx).toFixed(0)}%"></i></span></span><span class="num" style="color:${k === "agf" ? "var(--muted)" : v >= 0 ? "var(--ok)" : "var(--bad)"}">${v >= 0 ? "+" : "−"}${yz(Math.abs(v), 2)}</span></div>`).join("")}
          <p class="dipnot">AGF en güçlü kriter; diğerleri piyasanın kaçırdığı bilgiyi düzeltir. <b style="color:var(--ok)">+</b> piyasanın küçümsediği, <b style="color:var(--bad)">−</b> piyasanın fazla oynadığı bilgi (ör. son yarışı iyi geçen at halk tarafından fazla oynanır). Canlı modelin ortak ağırlıkları${S?.model_tarih ? `, ${esc(S.model_tarih)} tarihine kadarki sonuçlarla eğitildi` : ""}.</p></div></div>
        <div class="kart"><div class="kart-h"><h3>${IK.hedef}Bilmeniz gerekenler</h3></div><div class="kart-b" style="display:grid;gap:10px;font-size:14px">
          <p style="margin:0">Model AGF'den istatistiksel olarak anlamlı ama küçük farkla daha iyi olasılık üretir; kazananı birinci bilme oranı AGF ile aynı düzeydedir.</p>
          <p style="margin:0">Sabah programlarında TJK AGF'si henüz yoktur; o saatlerde bülten ortalaması (Blt) kullanılır ve kilit öncesi güncellenir.</p>
          <p style="margin:0">Pedigri üç sezonluk veriyle test edildi; aygır ve kısrak başarısı AGF'nin üstüne anlamlı bilgi katmadı (piyasa bunu zaten fiyatlıyor), bu yüzden modelde yok. TJK'nın yarış öncesi galop (idman) dereceleri 2 Kasım'dan beri modelde: son 30 gündeki galop sayısı, son galoptan beri geçen gün, en iyi ve son galoptaki 600 ve 400 m dereceleri ve çalışarak yapılan galoplar. Kilitli testte katkısı küçük ama olumlu çıktı.</p>
          <p style="margin:0">Geriye dönük testte her gün altılı oynamak uzun vadede zarar ettirdi. Atgoritma bahis tavsiyesi vermez; olasılık ve kayıt sunar.</p></div></div>
      </div>`;
  }

  /* ----- yasal ----- */
  const UYARI_KUPON = `<div class="uyari-not"><span class="yas18">18+</span><span>Kuponlar modelin olasılık hesabından üretilmiş örneklerdir; oynama önerisi ya da kazanç vaadi değildir. Bahis yalnızca TJK ve yetkili bayilerinden, kendi kararınızla ve kaybetmeyi göze alabileceğiniz tutarla yapılabilir.</span></div>`;
  function yasal() {
    const b = (bas, ic) => `<div><h3>${bas}</h3>${ic}</div>`;
    return `<div><h2 class="bas">Yasal Uyarı ve Gizlilik</h2><p class="aciklama">Atgoritma'yı kullanan herkes aşağıdaki koşulları kabul etmiş sayılır. Son güncelleme: 3 Kasım 2026.</p></div>
      <div class="kart"><div class="kart-b yasal" style="padding-top:16px">
        ${b("1. Sitenin niteliği", `<p>Atgoritma, at yarışlarına ilişkin kamuya açık verileri istatistik yöntemleriyle işleyen, <b>bilgilendirme ve eğlence amaçlı</b> bir sitedir. Gösterilen olasılıklar, sıralamalar, değer işaretleri ve kuponlar bir modelin hesaplama çıktısıdır; <b>bahis, yatırım veya mali tavsiye değildir</b> ve hiçbir koşunun sonucunu garanti etmez.</p>`)}
        ${b("2. Bahis kabul etmiyoruz", `<p>Atgoritma <b>bahis kabul etmez, kupon oynatmaz, bahse aracılık etmez</b>, ücret veya ödeme almaz. Hiçbir bahis sitesinin reklamını yapmaz ve bağlantı vermez. Türkiye'de at yarışı bahisleri yalnızca <b>Türkiye Jokey Kulübü (TJK) ve yetkili bayileri/kanalları</b> üzerinden yasal olarak oynanabilir. Yasa dışı bahis suçtur; bu tür sitelerden uzak durun.</p>`)}
        ${b("3. Yaş sınırı", `<p>Site <b>18 yaşından küçükler için değildir</b>. 18 yaşından küçüklerin şans oyunu ve bahis oynaması yasaktır.</p>`)}
        ${b("4. Sorumlu oyun", `<ul><li>Bahis ve şans oyunları bağımlılık yapabilir; kaybetmeyi göze alamayacağınız parayla, borçla ya da kaybı telafi etmek için oynamayın.</li><li>Geriye dönük testlerimizde her gün altılı oynamak uzun vadede <b>zarar</b> ettirmiştir. Geçmiş başarı gelecekteki sonuçların göstergesi değildir.</li><li>Yardım için: <b>Yeşilay Danışmanlık Merkezi (YEDAM) 115</b> · <a href="https://www.yesilay.org.tr" rel="noopener">yesilay.org.tr</a></li></ul>`)}
        ${b("5. Sorumluluğun sınırlandırılması", `<p>Sitedeki bilgilere dayanarak verilen kararlar tamamen kullanıcının kendi sorumluluğundadır. Atgoritma ve geliştiricileri, içeriğin kullanımından doğabilecek <b>doğrudan veya dolaylı hiçbir kayıp ve zarardan sorumlu tutulamaz</b>. Hizmet “olduğu gibi” sunulur; kesintisiz veya hatasız çalışacağı taahhüt edilmez.</p>`)}
        ${b("6. Veri kaynakları ve doğruluk", `<p>Program, sonuç, AGF ve idman (galop) bilgileri TJK'nın kamuya açık yayınlarından derlenir. Veriler otomatik işlendiği için gecikme, eksik veya hatalı bilgi olabilir; koşmayan atlar, son dakika değişiklikleri ve kesin sonuçlar için <b>resmi kaynak tjk.org</b>'dur. Uzman görüşleri kamuya açık kaynaklardan istatistik amacıyla toplanır; kişi adı yayımlanmaz, yalnızca takma adla toplu başarı ölçümü gösterilir.</p>`)}
        ${b("7. Bağımsızlık ve markalar", `<p>Atgoritma bağımsız bir projedir; <b>Türkiye Jokey Kulübü veya herhangi bir bahis kuruluşu ile bağlantısı, ortaklığı ya da onayı yoktur</b>. Anılan kurum, yarış ve at adları ile markalar sahiplerine aittir ve yalnızca bilgi vermek amacıyla kullanılır. Hak sahiplerinin talebi halinde ilgili içerik kaldırılır.</p>`)}
        ${b("8. Gizlilik ve kişisel veriler (KVKK)", `<ul><li>Atgoritma üyelik, form, yorum veya ödeme bölümü içermez; ziyaretçilerden ad, e-posta, telefon gibi <b>kişisel veri toplamaz</b>, reklam veya izleme (analitik) çerezi kullanmaz.</li><li>Site tarayıcınızda herhangi bir bilgi saklamaz.</li><li>Site GitHub Pages üzerinde barındırılır, alan adı Cloudflare üzerinden yönlendirilir ve yazı tipleri Google Fonts'tan yüklenir. Bu hizmet sağlayıcılar, sayfanın iletilmesi için IP adresi ve tarayıcı bilgisi gibi teknik erişim kayıtlarını kendi gizlilik politikalarına göre yurt dışında işleyebilir.</li></ul>`)}
        ${b("9. Değişiklikler", `<p>Bu metin ve site içeriği önceden bildirim yapılmaksızın güncellenebilir. Güncel metin her zaman bu sayfadadır.</p>`)}
        ${V.iletisim ? b("10. İletişim", `<p>Hak talepleri, düzeltme ve kaldırma istekleri için: <a href="mailto:${esc(V.iletisim)}">${esc(V.iletisim)}</a></p>`) : ""}
      </div></div>`;
  }


  /* ----- Atgoritma yorumları: model çıktısından tahminci gibi yorum ----- */
  const AN = (z) => `<span class="an">(${z.no}) ${esc(z.at)}</span>`;
  function atgYorum(k) {
    const a = [...k.atlar].sort((x, y) => y.p - x.p);
    const t = a[0], r1 = a[1], r2 = a[2];
    const agfVar = k.piyasa === "TJK AGF";
    const agfFav = [...k.atlar].sort((x, y) => y.agf - x.agf)[0];
    const banko = t.p >= 0.45 && t.p - (r1 ? r1.p : 0) >= 0.25 && k.surpriz < 0.25;
    const cumle = [];
    cumle.push(k.surpriz < 0.22 ? "Favorisi net görünen bir koşu." : k.surpriz < 0.32 ? "Dengeli bir koşu; ilk iki-üç at öne çıkıyor." : "Karışık, sürprize açık bir koşu; kuponda geniş açmak gerekebilir.");
    const leh = nedenler(t, k).filter(([f, v]) => v > 0 && !/^AGF|^Bülten/.test(f)).slice(0, 2).map(([f]) => f.toLocaleLowerCase("tr-TR"));
    cumle.push(`${AN(t)} %${pct(t.p)} ile ${banko ? "<b>güçlü model favorimiz</b>" : "ilk tercihimiz"}${leh.length ? `; öne çıkaran ${esc(leh.join(" ve "))}` : ""}.`);
    if (agfVar && t.agf < t.p * 0.8) cumle.push(`Piyasa onu daha az görüyor (AGF %${pct(t.agf)}).`);
    if (r1 && r2) cumle.push(`${AN(r1)} (%${pct(r1.p)}) ve ${AN(r2)} (%${pct(r2.p)}) en yakın rakipleri.`);
    if (agfVar && agfFav.no !== t.no) cumle.push(`Piyasanın favorisi ${AN(agfFav)} (AGF %${pct(agfFav.agf)}); biz ona %${pct(agfFav.p)} veriyoruz.`);
    const sur = agfVar ? a.slice(3).filter((z) => z.p >= 0.05 && z.p > z.agf * 1.2).sort((x, y) => y.p / y.agf - x.p / x.agf)[0] : null;
    if (sur) cumle.push(`Sürpriz adayımız ${AN(sur)}: biz %${pct(sur.p)}, piyasa %${pct(sur.agf)} veriyor.`);
    let top = 0;
    const tercih = [];
    for (const z of a) { if (tercih.length && (top >= 0.6 || tercih.length >= 5)) break; tercih.push(z); top += z.p; }
    if (banko) tercih.splice(1);
    const ik = [];
    for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
      const x = a[i], y = a[j];
      ik.push({ n: [x.no, y.no].sort((u, v) => u - v), p: x.p * y.p / Math.max(1 - x.p, 1e-6) + y.p * x.p / Math.max(1 - y.p, 1e-6) });
    }
    ik.sort((u, v) => v.p - u.p);
    const ikili = ik.slice(0, k.surpriz >= 0.30 ? 3 : 1);
    return { cumle, tercih, banko, ikili };
  }
  function atgKarne() {
    if (!S || !S.gunluk) return "";
    let n = 0, m1 = 0, a1 = 0, m3 = 0;
    Object.entries(S.gunluk).slice(-30).forEach(([, v]) => { n += v.n; m1 += v.model_birinci * v.n; a1 += v.agf_birinci * v.n; m3 += v.model_ilk3 * v.n; });
    if (!n) return "";
    return `<section class="kart"><div class="kart-h"><h3>${IK.hedef}Atgoritma'nın yorumcu karnesi</h3><span class="sub">son 30 gün, ${n.toLocaleString("tr-TR")} koşu</span></div>
      <div class="kart-b"><div class="isabet-ikili">
        <div><span class="sub">İlk tercihimiz kazandı</span><span class="buyuk-sayi gold-text">%${yz(m1 / n)}</span><span class="fark">AGF favorisi %${yz(a1 / n)}</span></div>
        <div><span class="sub">Kazanan ilk 3 tercihimizde</span><span class="buyuk-sayi gold-text">%${yz(m3 / n)}</span><span class="fark">her koşu sonuçla kayda geçer</span></div></div></div></section>`;
  }
  function yorumSayfa() {
    const g = gun(), s = sehir();
    if (!g || !s) return `<div class="kart bos">Henüz yorum yok.</div>`;
    const kart = nolar(s).map((no) => {
      const k = s.kosular[no], y = atgYorum(k), r = sonuc(g, s, no);
      const w = r ? (r.kazananlar || [r.no]) : [];
      const sira = r ? y.tercih.findIndex((z) => w.includes(z.no)) : -1;
      const durum = !r ? "" : sira === 0 ? `<span class="pill ok">✓ İlk tercihimiz kazandı</span>` : sira > 0 ? `<span class="pill ok">✓ ${sira + 1}. tercihimiz kazandı</span>` : `<span class="pill bad">✗ Kazanan ${esc(r.no)} listemizde yoktu</span>`;
      const etiket = y.banko ? `<span class="pill ok">Güçlü favori</span>` : k.surpriz >= 0.32 ? `<span class="pill warn">Sürprize açık</span>` : "";
      return `<article class="kart yorum-kart" id="y${no}">
        <div class="yorum-ust"><span class="rno gold-text">${no}</span><span class="bilgi"><b>${esc(k.saat)} · ${esc(k.tip)}</b><span>${esc(k.grup)} · ${k.mesafe} m ${esc(k.pist)}</span></span>
          <span class="sag">${durum || etiket}</span></div>
        <div class="yazar"><span class="atg-rozet" aria-hidden="true">A</span><span><b>Atgoritma</b> yorumluyor</span></div>
        <p class="yorum-metin">${y.cumle.join(" ")}</p>
        <div class="tercih"><span>${y.banko ? "Güçlü model favorisi" : "Tercih sıramız"}</span>${y.tercih.map((z, i) => `<span class="no${i === 0 ? " ilk" : ""}${w.includes(z.no) ? " w" : ""}">${z.no}</span>`).join("")}</div>
        <div class="tercih ikili-oneri"><span>İkili önerisi${y.ikili.length > 1 ? " (sürprizli koşu, 3 ikili)" : ""}</span>${y.ikili.map((x) => {
          const tut = r && r.sira && r.sira.length >= 2 && x.n.includes(r.sira[0]) && x.n.includes(r.sira[1]);
          return `<span class="no ikili${tut ? " w" : ""}" title="Model olasılığı %${pct(x.p, 1)}">${x.n.join("-")}</span>`;
        }).join("")}<span class="sub">${y.ikili.map((x) => "%" + pct(x.p, 0)).join(" · ")}</span></div>
        ${r ? `<div class="sub">Kazanan <b>${esc(r.no)} ${esc(r.at)}</b> · ganyan ${esc(r.ganyan).replace(".", ",")}${r.sira ? ` · ilk iki ${r.sira.slice(0, 2).join("-")}` : ""}</div>` : ""}
      </article>`;
    }).join("");
    const kup = (s.altililar || []).map((a) => Object.entries(a.kuponlar).map(([ad, kp]) => `<div class="yorum-kupon kart">
        <div class="yazar"><span class="atg-rozet" aria-hidden="true">A</span><span><b>Atgoritma</b> · ${a.sira}. altılı · ${kuponAd(ad)} · ${tl(kp.tutar)} · tutma %${pct(kp.tutma, 1)}</span></div>
        <div class="ay">${kp.ayaklar.map((l, i) => `${a.bas + i}. koşu: ${kp.kapali && kp.kapali[i] ? "hepsi" : l.join("-")}`).join(" · ")}</div></div>`).join("")).join("");
    return `<div><h2 class="bas">Atgoritma Yorumları · ${esc(s.ad)} · ${gunYaz(g.tarih)}</h2><p class="aciklama">Her koşu için modelin görüşü bir yorumcu gibi yazılır: ilk tercih ve nedenleri, en yakın rakipler, piyasa ile ayrıştığımız atlar ve sürpriz adayımız. Yorumlar modelin hesaplamasından otomatik üretilir; koşu bitince tuttu mu tutmadı mı kayda geçer.
      İkili önerisi modelin en olası sırasız ikilisidir; sürprizli koşularda en olası 3 ikili verilir. Geçmiş testte (2026, 4.618 koşu, gerçek ödemelerle) her koşu model ikilisi 100 TL'ye 74 TL, sürprizli koşularda 3 ikili 81 TL geri getirdi; AGF'nin ikilisi 71 TL. Model piyasadan biraz iyidir ama bahis kesintisini aşmaz: istatistik çıktısıdır, kazanç vaadi değildir.</p>${UYARI_KUPON}</div>
      ${atgKarne()}${canliBant(g)}${secici()}
      <div class="chipler">${nolar(s).map((n) => `<button class="chip" type="button" data-git="y${n}">${n}. koşu</button>`).join("")}</div>
      <div class="yorum-liste">${kart}</div>
      ${kup ? `<h3 class="bas" style="font-size:20px;margin:6px 0 0">Atgoritma kuponları</h3><div class="yorum-liste">${kup}</div>` : ""}`;
  }

  /* ----- yönlendirme ----- */
  const GORUNUM = { ana, yarislar, motor, altili: altiliSayfa, yorum: yorumSayfa, uzmanlar, karsilastir, istatistik, yasal };
  let aktif = "ana", hedefKosu = null;
  function ciz() {
    $("#gunSec").innerHTML = V.gunler.map((g, i) => `<option value="${i}" ${i === gi ? "selected" : ""}>${gunYaz(g.tarih)}</option>`).join("");
    document.querySelectorAll("[data-view]").forEach((el) => { el.hidden = el.dataset.view !== aktif; });
    document.querySelectorAll("nav.menu a, nav.alt-menu a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === "#" + aktif ? "page" : "false"));
    $("#v-" + aktif).innerHTML = `<div style="display:grid;gap:18px">${GORUNUM[aktif]()}</div>`;
    if (hedefKosu) { const t = document.getElementById(hedefKosu); hedefKosu = null; if (t) setTimeout(() => t.scrollIntoView({ behavior: "smooth", block: "start" }), 30); }
    $("#alt").innerHTML = `<div class="yasal-serit"><span class="yas18">18+</span><span>Bilgilendirme amaçlıdır, bahis tavsiyesi değildir.</span><span>Bahis kabul edilmez.</span><span>TJK ile bağlantımız yoktur.</span><span>Sorumlu oyun: YEDAM 115</span><a href="#yasal">Yasal Uyarı ve Gizlilik</a></div>
      <p>Atgoritma, TJK'nın yayımladığı program ve sonuçlarla eğitilen bir istatistik modelinin çıktısıdır; sonuçları garanti etmez, resmi bilgi için tjk.org esastır. Güncellendi ${esc(V.uretildi)}.</p><p>Form kutularında K kum, Ç çim, S sentetik; – derece dışı. Değer ≥: ganyan oranı bu değerin üstündeyse model o ata piyasadan fazla şans veriyor.</p>`;
  }
  function hashOku() { const h = (location.hash || "").slice(1); if (GORUNUM[h] && !(V.uzman_kapali && h === "uzmanlar")) aktif = h; }
  window.addEventListener("hashchange", () => { hashOku(); ciz(); if (!hedefKosu) window.scrollTo({ top: 0 }); });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-s],[data-k],[data-a],[data-git],[data-sk]");
    if (!b) return;
    if (b.dataset.sk) {
      const [j, n] = b.dataset.sk.split("|").map(Number);
      si = j; ki = n; ai = 0;
      if (aktif !== "ana" && aktif !== "motor") { location.hash = "ana"; } else ciz();
      setTimeout(() => document.getElementById(aktif === "motor" ? "nedenKart" : "modelTahmin")?.scrollIntoView({ behavior: "smooth", block: "start" }), 40);
      return;
    }
    if (b.dataset.s != null) { si = +b.dataset.s; ki = null; kk = null; ai = 0; ciz(); }
    else if (b.dataset.k != null) { ki = +b.dataset.k; ciz(); }
    else if (b.dataset.a != null) { ai = +b.dataset.a; ciz(); }
    else if (b.dataset.git) {
      if (aktif === "yarislar" || aktif === "yorum") { e.preventDefault(); document.getElementById(b.dataset.git)?.scrollIntoView({ behavior: "smooth", block: "start" }); }
      else hedefKosu = b.dataset.git;
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "gunSec") { gi = +e.target.value; si = 0; ki = null; kk = null; ai = 0; ciz(); }
    if (e.target.id === "kSec") { kk = +e.target.value; ka = 0; kb = 1; ciz(); }
    if (e.target.id === "kA") { ka = +e.target.value; ciz(); }
    if (e.target.id === "kB") { kb = +e.target.value; ciz(); }
  });
  hashOku();
  ciz();

  /* ----- canlı takip: yarış günü yeni sonuç yayımlandıkça veriyi yeniler ----- */
  const bugunStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  async function tazele() {
    const h = new Date().getHours();
    if (!/^https?:$/.test(location.protocol) || !V.gunler.length || V.gunler[0].tarih !== bugunStr() || h < 11 || h >= 23) return;
    try {
      const t = await (await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" })).text();
      const m = t.match(/<script id="veri" type="application\/json">([\s\S]*?)<\/script>/);
      if (!m) return;
      const Y = JSON.parse(m[1]);
      if (Y.uretildi === V.uretildi) return;
      const eski = new Set(Object.keys(V.sonuc));
      const yeni = Object.keys(Y.sonuc).filter((k) => !eski.has(k));
      const gt = gun()?.tarih;
      Object.assign(V, Y);
      gi = Math.max(0, V.gunler.findIndex((x) => x.tarih === gt));
      ciz();
      if (yeni.length) {
        const [d, sl, no] = yeni[yeni.length - 1].split("|");
        const r = V.sonuc[yeni[yeni.length - 1]];
        const ad = V.gunler.find((x) => x.tarih === d)?.sehirler.find((x) => x.slug === sl)?.ad || sl;
        const el = document.createElement("div");
        el.className = "yeni-sonuc";
        el.setAttribute("role", "status");
        el.innerHTML = `Yeni sonuç · <b>${esc(ad)} ${no}. koşu</b>: ${r.no} ${esc(r.at)} kazandı`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 9000);
      }
    } catch (e) {}
  }
  setInterval(tazele, 90000);

  // 18+ onay penceresi açılışta gösterilmez (kullanıcı kararı, 4 Kasım 2026); uyarılar alt şeritte ve Yasal sayfasında
})();
</script>
