# atgoritma.com yayını (10 Kasım 2026). GitHub'ın hazır Pages yayını ~12.800 dosyayı 10 dakikada eşitleyemeyip
# zaman aşımına düşüyordu; burada bekleme süresi 30 dakika ve üst üste gelen yayınlar birbirini iptal etmez, sıraya girer.
name: Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      # Her iş kendi gönderiminin değil, o anki en güncel sayfanın kopyasını yayınlar: sırada bekleyip geç çalışan
      # eski bir iş siteyi eski hâline döndüremez (12 Kasım 2026, GitHub arızasında yaşandı).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: dagit
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
